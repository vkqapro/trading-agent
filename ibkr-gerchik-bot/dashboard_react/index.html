        </GlassCard>
      </div>

      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="data_object" title="JSON Payload" badge={data.scan_timestamp ? String(data.scan_timestamp).slice(0,19).replace('T',' ') : 'latest'}/>
        <pre style={{margin:0,maxHeight:360,overflow:'auto',padding:18,background:R(C.surfLowest,0.55),fontFamily:"'JetBrains Mono',monospace",fontSize:11,lineHeight:1.45,color:C.onVar,whiteSpace:'pre-wrap'}}>
{JSON.stringify({scan_timestamp:data.scan_timestamp,timeframe:data.timeframe,universe_size:data.universe_size,signals_found:data.signals_found,signals:data.signals,rejected:data.rejected?.slice(0,80)},null,2)}
        </pre>
      </GlassCard>
    </div>
  );
}

function TabOrdersJournal({refreshKey=0}) {
  const [data,setData]=useState(null);
  const [selectedId,setSelectedId]=useState(null);
  const [symbolSearch,setSymbolSearch]=useState('');
  const [openDateFrom,setOpenDateFrom]=useState('');
  const [openDateTo,setOpenDateTo]=useState('');
  const [statusFilter,setStatusFilter]=useState('ALL');
  const [marketFilter,setMarketFilter]=useState('ALL');
  const [sourceFilter,setSourceFilter]=useState('ALL');
  const [tf,setTf]=useState('1D');
  const [reviewChartRange,setReviewChartRange]=useState('ALL');
  const [bars,setBars]=useState([]);
  const [barsInfo,setBarsInfo]=useState({stale:false,lastDate:null});
  const [reviewPlan,setReviewPlan]=useState(null);
  const [showVol,setShowVol]=useState(true);
  const [showReviewRaw,setShowReviewRaw]=useState(false);
  const [showReviewTrade,setShowReviewTrade]=useState(true);
  const [showStrategy,setShowStrategy]=useState(false);
  const [showStrategy2,setShowStrategy2]=useState(false);
  const [showGaussian,setShowGaussian]=useState(false);
  const [showGaussianSignals,setShowGaussianSignals]=useState(false);
  const [reviewDraft,setReviewDraft]=useState({});
  const [saving,setSaving]=useState(false);
  const reviewChartFullscreenRef = useRef(null);
  const money = v => v!=null && Number.isFinite(Number(v)) ? `$${Number(v).toFixed(Math.abs(Number(v))>=10?2:4)}` : '—';
  const num = (v,d=2) => v!=null && Number.isFinite(Number(v)) ? Number(v).toFixed(d) : '—';
  const fmtTime = v => v ? String(v).replace('T',' ').replace('+00:00','Z').slice(0,19) : '—';

  const loadJournal = useCallback(()=>{
    fetch(`${API}/orders-journal`,{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{
        setData(d);
        const rows=d.rows||[];
        setSelectedId(prev=>prev && rows.some(r=>r.id===prev) ? prev : rows[0]?.id || null);
      })
      .catch(()=>setData({rows:[],metrics:{}}));
  },[]);
  useEffect(()=>{ loadJournal(); },[refreshKey, loadJournal]);

  const rows=data?.rows||[];
  const selected=rows.find(r=>r.id===selectedId)||rows[0]||null;
  const markets=['ALL',...new Set(rows.map(r=>r.market).filter(Boolean))];
  const sources=['ALL',...new Set(rows.map(r=>r.source).filter(Boolean))];
  const symbolNeedle = symbolSearch.trim().toUpperCase();
  const openFromTime = openDateFrom ? new Date(`${openDateFrom}T00:00:00`).getTime() : null;
  const openToTime = openDateTo ? new Date(`${openDateTo}T23:59:59`).getTime() : null;
  const filtered=rows.filter(r=>{
    if(symbolNeedle && !String(r.symbol||'').toUpperCase().includes(symbolNeedle)) return false;
    if(statusFilter==='OPEN' && !['OPEN','SUBMITTED','OPEN_ALERT'].includes(String(r.status).toUpperCase())) return false;
    if(statusFilter==='CLOSED' && !(String(r.status).toUpperCase().startsWith('CLOSED') || r.closed_at)) return false;
    if(statusFilter==='UNREVIEWED' && (r.review?.review_status||'Unreviewed')!=='Unreviewed') return false;
    if(statusFilter==='REVIEWED' && (r.review?.review_status||'Unreviewed')!=='Reviewed') return false;
    if(statusFilter==='WINNERS' && !(Number(r.pnl)>0)) return false;
    if(statusFilter==='LOSERS' && !(Number(r.pnl)<0)) return false;
    if(openFromTime!=null || openToTime!=null){
      const openedAt = r.opened_at || r.created_at;
      const openedTime = openedAt ? new Date(String(openedAt).replace(' ','T')).getTime() : NaN;
      if(!Number.isFinite(openedTime)) return false;
      if(openFromTime!=null && openedTime < openFromTime) return false;
      if(openToTime!=null && openedTime > openToTime) return false;
    }
    if(marketFilter!=='ALL' && r.market!==marketFilter) return false;
    if(sourceFilter!=='ALL' && r.source!==sourceFilter) return false;
    return true;
  });

  useEffect(()=>{
    if(!selected) return;
    setReviewDraft({
      review_status:selected.review?.review_status||'Unreviewed',
      grade:selected.review?.grade||'',
      mistake_type:selected.review?.mistake_type||'',
      notes:selected.review?.notes||'',
      decision_quality:selected.review?.decision_quality||{},
    });
  },[selected?.id]);

  useEffect(()=>{
    if(!selected?.symbol) return;
    const apitf = TF_API[tf]||'daily';
    const endpoint = selected.market==='CRYPTO'
      ? `${API}/crypto/bars/${encodeURIComponent(selected.symbol)}/${apitf}`
      : `${API}/bars/${encodeURIComponent(selected.symbol)}/${apitf}`;
    fetch(endpoint)
      .then(r=>r.json())
      .then(d=>{setBars(d.bars||[]);setBarsInfo({stale:d.stale,lastDate:d.last_date});})
      .catch(()=>{setBars([]);setBarsInfo({stale:true,lastDate:null});});
    const planEndpoint = selected.market==='CRYPTO'
      ? `${API}/crypto/${encodeURIComponent(selected.symbol)}`
      : `${API}/preopen/${encodeURIComponent(selected.symbol)}`;
    fetch(planEndpoint)
      .then(r=>r.ok?r.json():null)
      .then(d=>setReviewPlan(d||null))
      .catch(()=>setReviewPlan(null));
  },[selected?.id, selected?.symbol, selected?.market, tf, refreshKey]);

  const saveReview = async()=>{
    if(!selected) return;
    setSaving(true);
    try{
      const r=await fetch(`${API}/orders-journal/review`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:selected.id,...reviewDraft}),
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok || d.ok===false) throw new Error(d.detail||d.message||'Save failed');
      loadJournal();
    }catch(e){
      alert(`Review save failed: ${e.message||e}`);
    }finally{
      setSaving(false);
    }
  };

  const reviewRangeCount = RANGE_COUNTS[reviewChartRange]||9999;
  const visibleReviewBars = bars.slice(-reviewRangeCount);
  const strategyOverlay = useMemo(()=>{
    const overlays=[
      showStrategy ? sliceOverlayPoints(buildBmsbStrategyOverlay(bars), reviewRangeCount) : null,
      showStrategy2 ? sliceOverlayPoints(buildBmsbStrategy2Overlay(bars), reviewRangeCount) : null,
    ].filter(Boolean);
    return overlays.length ? overlays : null;
  },[bars,showStrategy,showStrategy2,reviewRangeCount]);
  const gaussianOverlay = useMemo(()=>{
    if(!showGaussian && !showGaussianSignals) return null;
    const full=buildGaussianChannelOverlay(bars);
    return full ? {...full,showChannel:showGaussian,showSignals:showGaussianSignals,points:full.points.slice(-reviewRangeCount)} : null;
  },[bars,showGaussian,showGaussianSignals,reviewRangeCount]);
  const reviewChartLevels = useMemo(
    ()=>buildChartLevels(reviewPlan?.trade_levels, reviewPlan?.raw_levels, showReviewTrade, showReviewRaw),
    [reviewPlan, showReviewTrade, showReviewRaw]
  );

  const side=String(selected?.side||'BUY').toUpperCase();
  const stopChanged = selected?.current_stop!=null && selected?.planned_stop!=null && Math.abs(Number(selected.current_stop)-Number(selected.planned_stop))>0.0001;
  const targetChanged = selected?.current_target!=null && selected?.planned_target!=null && Math.abs(Number(selected.current_target)-Number(selected.planned_target))>0.0001;
  const lineSet = selected ? [
    selected.planned_target!=null && {p:selected.planned_target,color:C.lime,label:`TARGET PLAN ${money(selected.planned_target)}`},
    targetChanged && {p:selected.current_target,color:C.lime,label:`CURRENT TARGET ${money(selected.current_target)}`,dash:[6,5]},
    selected.planned_entry!=null && {p:selected.planned_entry,color:C.ocean,label:`ENTRY PLAN ${money(selected.planned_entry)}`},
    selected.planned_stop!=null && {p:selected.planned_stop,color:C.err,label:`STOP PLAN ${money(selected.planned_stop)}`},
    stopChanged && {p:selected.current_stop,color:C.err,label:`CURRENT STOP ${money(selected.current_stop)}`,dash:[6,5]},
    selected.actual_exit!=null && {p:selected.actual_exit,color:C.magenta,label:`EXIT ${money(selected.actual_exit)}`},
  ].filter(Boolean) : [];
  const zoneSet = selected ? [
    selected.planned_entry!=null && selected.planned_stop!=null && {p1:selected.planned_entry,p2:selected.planned_stop,color:C.err,opacity:0.08},
    selected.planned_entry!=null && selected.planned_target!=null && {p1:selected.planned_entry,p2:selected.planned_target,color:C.lime,opacity:0.06},
  ].filter(Boolean) : [];
  const markers = selected ? [
    selected.actual_entry!=null && {time:selected.opened_at||selected.created_at,price:selected.actual_entry,kind:'entry',label:`${side} ENTRY`,color:side==='SELL'?C.err:C.lime},

/* ── level data → CandleChart levels prop ────────────────────────────────── */
function buildChartLevels(tradeLevels, rawLevels, showTrade, showRaw) {
  const seen = new Set();
  const out = [];
  const add = (l, color, showZone) => {
    const price = Number(l.price);
    if(!Number.isFinite(price)) return;
    const key = price.toFixed(4);
    if(seen.has(key)) return;
    seen.add(key);
    const zoneLow = Number(l.zone_low), zoneHigh = Number(l.zone_high);
    const hasZone = l.zone_low!=null && l.zone_high!=null
      && Number.isFinite(zoneLow) && Number.isFinite(zoneHigh);
    out.push({
      p: price,
      zoneLow: hasZone ? Math.min(zoneLow,zoneHigh) : undefined,
      zoneHigh: hasZone ? Math.max(zoneLow,zoneHigh) : undefined,
      showZone,
      color,
      label: `${l.type==='gap'?'GAP':l.type==='abnormal_candle'?'ABN':'LVL'} ${Number(l.price).toFixed(2)} · ${l.touches??'?'}T`,
    });
  };
  if(showTrade) (tradeLevels||[]).forEach(l => add(l, C.cyan, true));
  if(showRaw)   (rawLevels||[]).forEach(l  => add(l, C.outline, false));
  return out.sort((a,b)=>b.p-a.p);
}

function sliceOverlayPoints(overlay, count) {
  if(!overlay) return null;
  const n = count || 9999;
  return {...overlay, points:(overlay.points||[]).slice(-n)};
}

/* ── strategies/bmsb_strategy_1 → Forecast chart overlay ─────────────────── */
function buildBmsbStrategyOverlay(bars) {
  const rows = (bars||[])
    .map((b,i)=>({
      i,
      t:b.t,
      d:new Date(b.t),
      close:Number(b.close),
    }))
    .filter(r=>r.t && !Number.isNaN(r.d.getTime()) && Number.isFinite(r.close));
  if(rows.length < 21) return null;

  const smaLen = 20, emaLen = 21;
  const calcPointsFromSeries = (series, mapToBarIndex, labels) => {
    const alpha = 2 / (emaLen + 1);
    let ema = null;
    const values = [];
    series.forEach((row,i)=>{
      ema = ema == null ? row.close : (row.close - ema) * alpha + ema;
      let sma = null;
      if(i >= smaLen - 1){
        let sum = 0;
        for(let j=i-smaLen+1;j<=i;j++) sum += series[j].close;
        sma = sum / smaLen;
      }
      const prev = i > 0 ? values[i-1] : null;
      const signal = i > 0 && Number.isFinite(sma) && Number.isFinite(ema)
        && Number.isFinite(prev?.sma) && Number.isFinite(prev?.ema)
          ? (prev.ema <= prev.sma && ema > sma ? 'entry'
            : prev.ema >= prev.sma && ema < sma ? 'exit'
            : null)
          : null;
      values.push({...row, sma, ema, signal});
    });

    const mapped = new Map();
    values.forEach(v=>mapped.set(mapToBarIndex(v), v));
    const points = (bars||[]).map((b,i)=>{
      const v = mapped.get(i);
      return {
        sma: v?.sma ?? null,
        ema: v?.ema ?? null,
        close: Number(b.close),
        signal: v?.signal || null,
      };
    });
    return {
      name:'BMSB Strategy 1',
      smaColor:C.err,
      emaColor:C.lime,
      bandColor:'#ffb35c',
      entryColor:'#1f8bff',
      exitColor:'#ff1744',
      smaLabel:labels.sma,
      emaLabel:labels.ema,
      points,
    };
  };

  const fridayKey = d => {
    const x = new Date(d.getTime());
    const day = x.getDay(); // 0 Sun ... 5 Fri
    const add = day === 0 ? -2 : day === 6 ? -1 : 5 - day;
    x.setDate(x.getDate() + add);
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  };

  const weekly = [];
  const weekIndex = new Map();
  rows.forEach(r=>{
    const key = fridayKey(r.d);
    if(!weekIndex.has(key)){
      weekIndex.set(key, weekly.length);
      weekly.push({key, close:r.close, lastRow:r.i});
    } else {
      const w = weekly[weekIndex.get(key)];
      w.close = r.close;
      w.lastRow = r.i;
    }
  });

  if(weekly.length < 21) {
    return calcPointsFromSeries(rows, r=>r.i, {sma:'20 SMA', ema:'21 EMA'});
  }

  const weeklyOverlay = calcPointsFromSeries(weekly, w=>w.lastRow, {sma:'20W SMA', ema:'21W EMA'});
  const byWeek = new Map();
  weeklyOverlay.points.forEach((p,i)=>{
    const bar = bars?.[i];
    if(!bar?.t) return;
    const d = new Date(bar.t);
    if(Number.isNaN(d.getTime())) return;
    const key = fridayKey(d);
    const w = weekly.find(item=>item.key===key);
    if(w) byWeek.set(key, weeklyOverlay.points[w.lastRow]);
  });

  const points = (bars||[]).map((b,i)=>{
    const d = new Date(b.t);
    const p = !Number.isNaN(d.getTime()) ? byWeek.get(fridayKey(d)) : null;
    return {
      sma: p?.sma ?? null,
      ema: p?.ema ?? null,
      close: Number(b.close),
      signal: p?.signal && weekly.some(w=>w.lastRow===i) ? p.signal : null,
    };
  });

  return {...weeklyOverlay, points};
}

/* ── BMSB Strategy 2: band reclaim / band loss with tolerance ─────────────── */
function buildBmsbStrategy2Overlay(bars, opts={}) {
  const rows = (bars||[])
    .map((b,i)=>({
      i,
      t:b.t,
      d:new Date(b.t),
      close:Number(b.close),
    }))
    .filter(r=>r.t && !Number.isNaN(r.d.getTime()) && Number.isFinite(r.close));
  if(rows.length < 21) return null;

  const smaLen = opts.smaLen || 20;
  const emaLen = opts.emaLen || 21;
  const tolerancePct = Number.isFinite(Number(opts.reclaimTolerancePct))
    ? Number(opts.reclaimTolerancePct)
    : 0.5;
  const toleranceMult = tolerancePct / 100;
  const startDate = opts.startDate ? new Date(opts.startDate) : new Date('2018-01-01T00:00:00');
  const endDate = opts.endDate ? new Date(opts.endDate) : new Date('2026-04-16T23:59:59');

  const fridayKey = d => {
    const x = new Date(d.getTime());
    const day = x.getDay();
    const add = day === 0 ? -2 : day === 6 ? -1 : 5 - day;
    x.setDate(x.getDate() + add);
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  };

  const weekly = [];
  const weekIndex = new Map();
  rows.forEach(r=>{
    const key = fridayKey(r.d);
    if(!weekIndex.has(key)){
      weekIndex.set(key, weekly.length);
      weekly.push({key, close:r.close, lastRow:r.i});
    } else {
      const w = weekly[weekIndex.get(key)];
      w.close = r.close;
      w.lastRow = r.i;
    }
  });
  const series = weekly.length >= 21 ? weekly : rows.map(r=>({...r, key:String(r.i), lastRow:r.i}));
  if(series.length < 21) return null;

  const alpha = 2 / (emaLen + 1);
  let ema = null;
  const weeklyValues = [];
  series.forEach((row,i)=>{
    ema = ema == null ? row.close : (row.close - ema) * alpha + ema;
    let sma = null;
    if(i >= smaLen - 1){
      let sum = 0;
      for(let j=i-smaLen+1;j<=i;j++) sum += series[j].close;
      sma = sum / smaLen;
    }
    const bandUpper = Number.isFinite(sma) && Number.isFinite(ema) ? Math.max(sma, ema) : null;
    const bandLower = Number.isFinite(sma) && Number.isFinite(ema) ? Math.min(sma, ema) : null;
    const entryLevel = Number.isFinite(bandUpper) ? bandUpper * (1 - toleranceMult) : null;
    const exitLevel = Number.isFinite(bandLower) ? bandLower * (1 + toleranceMult) : null;
    weeklyValues.push({...row, sma, ema, bandUpper, bandLower, entryLevel, exitLevel});
  });

  const mapped = new Map();
  if(weekly.length >= 21){
    const byWeek = new Map();
    weeklyValues.forEach(v=>byWeek.set(v.key, v));
    rows.forEach(r=>{
      const w = byWeek.get(fridayKey(r.d));
      if(w) mapped.set(r.i, w);
    });
  } else {
    weeklyValues.forEach(v=>mapped.set(v.i, v));
  }

  const points = rows.map((r, rowIdx)=>{
    const v = mapped.get(r.i);
    const prevRow = rows[rowIdx-1];
    const prev = prevRow ? mapped.get(prevRow.i) : null;
    const inRange = r.d >= startDate && r.d <= endDate;
    const entrySignal = inRange
      && Number.isFinite(prev?.entryLevel)
      && Number.isFinite(v?.entryLevel)
      && Number.isFinite(prevRow?.close)
      && prevRow.close <= prev.entryLevel
      && r.close > v.entryLevel;
    const exitSignal = inRange
      && Number.isFinite(prev?.exitLevel)
      && Number.isFinite(v?.exitLevel)
      && Number.isFinite(prevRow?.close)
      && prevRow.close >= prev.exitLevel
      && r.close < v.exitLevel;
    return {
      sma: v?.sma ?? null,
      ema: v?.ema ?? null,
      entryLevel: v?.entryLevel ?? null,
      exitLevel: v?.exitLevel ?? null,
      close: r.close,
      signal: entrySignal ? 'entry' : exitSignal ? 'exit' : null,
    };
  });

  const byIndex = new Map(rows.map((r,i)=>[r.i, points[i]]));
  const expandedPoints = (bars||[]).map((b,i)=>byIndex.get(i) || {
    sma:null,
    ema:null,
    entryLevel:null,
    exitLevel:null,
    close:Number(b.close),
    signal:null,
  });

  return {
    id:'bmsb-strategy-2',
    name:'BMSB Strategy 2',
    smaColor:'#ff315f',
    emaColor:'#d7ff00',
    bandColor:'#ffb35c',
    bandOpacity:0.09,
    lineOpacity:0.98,
    lineWidth:2.2,
    entryColor:'#1f8bff',
    exitColor:'#ff1744',
    entryLevelColor:'#1f8bff',
    exitLevelColor:'#bb6bff',
    smaLabel:'S2 20W SMA',
    emaLabel:'S2 21W EMA',
    entryLevelLabel:`S2 ENTRY -${tolerancePct}%`,
    exitLevelLabel:`S2 EXIT +${tolerancePct}%`,
    points: expandedPoints,
  };
}

/* ── GaussianChannel Strategy Vitaly v1.0 → Strategy chart overlay ───────── */
function buildGaussianChannelOverlay(bars, opts={}) {
  const rows = (bars||[]).map((b,i)=>({
    i,
    t:b.t,
    open:Number(b.open),
    high:Number(b.high),
    low:Number(b.low),
    close:Number(b.close),
    src:(Number(b.high)+Number(b.low)+Number(b.close))/3,
  })).filter(r=>
    Number.isFinite(r.high) && Number.isFinite(r.low) &&
    Number.isFinite(r.close) && Number.isFinite(r.src)
  );
  if(rows.length < 3) return null;

  const poles = Math.max(1, Math.min(4, Number(opts.poles ?? 4)));
  const period = Math.max(2, Number(opts.period ?? 144));
  const mult = Number(opts.mult ?? 1.414);
  const reducedLag = Boolean(opts.reducedLag ?? false);
  const fastResponse = Boolean(opts.fastResponse ?? false);
  const enableShorts = Boolean(opts.enableShorts ?? false);
  const lag = Math.floor((period - 1) / (2 * poles));
  const alphaFor = (p, n) => {
    const beta = (1 - Math.cos(2 * Math.PI / p)) / (Math.pow(Math.sqrt(2), 2 / n) - 1);
    return -beta + Math.sqrt(beta * beta + 2 * beta);
  };
  const gaussianFilter = (values, p, n) => {
    const alpha = alphaFor(p, n);
    let f1=null, f2=null, f3=null, f4=null;
    return values.map(v=>{
      const x = Number.isFinite(v) ? v : 0;
      if(f1==null){
        f1=x; f2=x; f3=x; f4=x;
        return x;
      }
      f1 = alpha*x + (1-alpha)*f1;
      f2 = alpha*f1 + (1-alpha)*f2;
      f3 = alpha*f2 + (1-alpha)*f3;
      f4 = alpha*f3 + (1-alpha)*f4;
      return n===1 ? f1 : n===2 ? f2 : n===3 ? f3 : f4;
    });
  };
  const crossOver = (prevA, prevB, a, b) =>
    Number.isFinite(prevA) && Number.isFinite(prevB) && Number.isFinite(a) && Number.isFinite(b) && prevA <= prevB && a > b;
  const crossUnder = (prevA, prevB, a, b) =>
    Number.isFinite(prevA) && Number.isFinite(prevB) && Number.isFinite(a) && Number.isFinite(b) && prevA >= prevB && a < b;

  const src = rows.map((r,i)=>{
    if(!reducedLag || i-lag < 0) return r.src;
    return r.src + (r.src - rows[i-lag].src);
  });
  const ranges = rows.map((r,i)=>{
    const prevClose = i>0 ? rows[i-1].close : r.close;
    const tr = Math.max(r.high-r.low, Math.abs(r.high-prevClose), Math.abs(r.low-prevClose));
    if(!reducedLag || i-lag < 0) return tr;
    const lagPrevClose = i-lag>0 ? rows[i-lag-1].close : rows[i-lag].close;
    const lagTr = Math.max(
      rows[i-lag].high-rows[i-lag].low,
      Math.abs(rows[i-lag].high-lagPrevClose),
      Math.abs(rows[i-lag].low-lagPrevClose)
    );
    return tr + (tr - lagTr);
  });

  const midMain = gaussianFilter(src, period, poles);
  const midFast = gaussianFilter(src, period, 1);
  const rangeMain = gaussianFilter(ranges, period, poles);
  const rangeFast = gaussianFilter(ranges, period, 1);
  const rowByBarIndex = new Map(rows.map((r,idx)=>[r.i, idx]));
  let position = 0;

  const points = (bars||[]).map((b,i)=> {
    const rowIdx = rowByBarIndex.has(i) ? rowByBarIndex.get(i) : -1;
    if(rowIdx < 0) return {mid:null, upper:null, lower:null, close:Number(b.close), bullish:null, signal:null};
    const mid = fastResponse ? (midMain[rowIdx]+midFast[rowIdx])/2 : midMain[rowIdx];
    const rangeFiltered = fastResponse ? (rangeMain[rowIdx]+rangeFast[rowIdx])/2 : rangeMain[rowIdx];
    const width = mult * rangeFiltered;
    const upper = mid + width;
    const lower = mid - width;
    const prevMid = rowIdx>0 ? (fastResponse ? (midMain[rowIdx-1]+midFast[rowIdx-1])/2 : midMain[rowIdx-1]) : null;
    const prevUpper = rowIdx>0 ? (
      (fastResponse ? (midMain[rowIdx-1]+midFast[rowIdx-1])/2 : midMain[rowIdx-1]) +
      mult * (fastResponse ? (rangeMain[rowIdx-1]+rangeFast[rowIdx-1])/2 : rangeMain[rowIdx-1])
    ) : null;
    const prevLower = rowIdx>0 ? (
      (fastResponse ? (midMain[rowIdx-1]+midFast[rowIdx-1])/2 : midMain[rowIdx-1]) -
      mult * (fastResponse ? (rangeMain[rowIdx-1]+rangeFast[rowIdx-1])/2 : rangeMain[rowIdx-1])
    ) : null;
    const close = Number(b.close);
    const prevClose = rowIdx>0 ? rows[rowIdx-1].close : null;
    const bullish = Number.isFinite(prevMid) ? mid > prevMid : null;
    const bearish = Number.isFinite(prevMid) ? mid < prevMid : null;
    let signal = null;
    if(bullish && crossOver(prevClose, prevUpper, close, upper) && position <= 0){
      signal = 'long_entry';
      position = 1;
    } else if(position > 0 && crossUnder(prevClose, prevUpper, close, upper)){
      signal = 'long_exit';
      position = 0;
    } else if(enableShorts && bearish && crossUnder(prevClose, prevLower, close, lower) && position >= 0){
      signal = 'short_entry';
      position = -1;
    } else if(enableShorts && position < 0 && crossOver(prevClose, prevLower, close, lower)){
      signal = 'short_exit';
      position = 0;
    }
    return {mid, upper, lower, close, bullish, bearish, signal};
  });

  return {
    name:'GaussianChannel Strategy Vitaly v1.0',
    period,
    poles,
    mult,
    upColor:'#00e5ff',
    downColor:'#ff5252',
    points,
  };
}

/* ── spinner ─────────────────────────────────────────────────────────────── */
function buildTrendMeterOverlay(bars) {
  const rows = (bars||[]).map((b,i)=>({
    i,
    open:Number(b.open),
    high:Number(b.high),
    low:Number(b.low),
    close:Number(b.close),
  })).filter(r=>Number.isFinite(r.open)&&Number.isFinite(r.high)&&Number.isFinite(r.low)&&Number.isFinite(r.close));
  if(rows.length < 3) return null;

  const closes = rows.map(r=>r.close);
  const hlc3 = rows.map(r=>(r.high+r.low+r.close)/3);
  const ohlc4 = rows.map(r=>(r.open+r.high+r.low+r.close)/4);
  const sma = (values, len) => values.map((_,i)=>{
    if(i < len-1) return null;
    let sum=0;
    for(let j=i-len+1;j<=i;j++){
      if(!Number.isFinite(values[j])) return null;
      sum += values[j];
    }
    return sum/len;
  });
  const ema = (values, len) => {
    const k=2/(len+1);
    let prev=null;
    return values.map(v=>{
      if(!Number.isFinite(v)) return prev;
      prev = prev==null ? v : v*k + prev*(1-k);
      return prev;
    });
  };
  const rsi = (values, len) => {
    let avgGain=null, avgLoss=null;
    return values.map((_,i)=>{
      if(i===0) return null;
      if(i < len) return null;
      if(i===len){
        let gain=0, loss=0;
        for(let j=1;j<=len;j++){
          const ch=values[j]-values[j-1];
          gain += Math.max(ch,0);
          loss += Math.max(-ch,0);
        }
        avgGain=gain/len;
        avgLoss=loss/len;
      } else {
        const ch=values[i]-values[i-1];
        avgGain=(avgGain*(len-1)+Math.max(ch,0))/len;
        avgLoss=(avgLoss*(len-1)+Math.max(-ch,0))/len;
      }
      if(avgLoss===0) return 100;
      const rs=avgGain/avgLoss;
      return 100 - 100/(1+rs);
    });
  };
  const cross = (a,b,i) => i>0
    && Number.isFinite(a[i]) && Number.isFinite(b[i])
    && Number.isFinite(a[i-1]) && Number.isFinite(b[i-1])
    && ((a[i-1] <= b[i-1] && a[i] > b[i]) || (a[i-1] >= b[i-1] && a[i] < b[i]));

  const emaFast8 = ema(closes,8);
  const emaSlow21 = ema(closes,21);
  const fastMacd = emaFast8.map((v,i)=>Number.isFinite(v)&&Number.isFinite(emaSlow21[i]) ? v-emaSlow21[i] : null);
  const fastSignal = ema(fastMacd,5);
  const fastHist = fastMacd.map((v,i)=>Number.isFinite(v)&&Number.isFinite(fastSignal[i]) ? v-fastSignal[i] : null);
  const rsi13 = rsi(closes,13);
  const rsi5 = rsi(closes,5);
  const rsi14 = rsi(closes,14);
  const ma1 = ema(closes,5);
  const ma2 = ema(closes,11);
  const ma3 = ema(closes,13);
  const ma4 = sma(closes,36);

  const esa = ema(hlc3,9);
  const absDev = hlc3.map((v,i)=>Number.isFinite(esa[i]) ? Math.abs(v-esa[i]) : null);
  const de = ema(absDev,9);
  const ci = hlc3.map((v,i)=>Number.isFinite(esa[i])&&Number.isFinite(de[i])&&de[i]!==0 ? (v-esa[i])/(0.015*de[i]) : null);
  const wt1 = ema(ci,12);
  const wt2 = sma(wt1,3);
  const yellowWave = wt1.map((v,i)=>Number.isFinite(v)&&Number.isFinite(wt2[i]) ? v-wt2[i] : null);

  const haOpen = [];
  const haClose = ohlc4;
  rows.forEach((r,i)=>{
    haOpen[i] = i===0 ? (r.open+r.close)/2 : (haOpen[i-1]+haClose[i-1])/2;
  });
  const trendCandle = rows.map((_,i)=>haClose[i]-haOpen[i] > 0);

  let prevAllBull=false;
  let prevAllBear=false;
  const rowPoints = rows.map((_,i)=>{
    // Pine defaults: TM1 Fast MACD histogram, TM2 RSI13 > 50, TM3 RSI5 > 50.
    const tm1 = Number.isFinite(fastHist[i]) ? fastHist[i] > 0 : null;
    const tm2 = Number.isFinite(rsi13[i]) ? rsi13[i] > 50 : null;
    const tm3 = Number.isFinite(rsi5[i]) ? rsi5[i] > 50 : null;
    const tb1 = Number.isFinite(ma1[i])&&Number.isFinite(ma2[i]) ? ma1[i] > ma2[i] : null;
    const tb2 = Number.isFinite(ma3[i])&&Number.isFinite(ma4[i]) ? ma3[i] > ma4[i] : null;
    const allBull = tm1===true && tm2===true && tm3===true;
    const allBear = tm1===false && tm2===false && tm3===false;
    const wtCross = cross(wt1, wt2, i);
    const wtCrossUp = Number.isFinite(wt1[i]) && Number.isFinite(wt2[i]) && wt2[i] - wt1[i] <= 0;
    const wtCrossDown = Number.isFinite(wt1[i]) && Number.isFinite(wt2[i]) && wt2[i] - wt1[i] >= 0;
    const yellowUp = i>0 && Number.isFinite(yellowWave[i]) && Number.isFinite(yellowWave[i-1]) && yellowWave[i] > yellowWave[i-1];
    const prevRsi14 = i>0 ? rsi14[i-1] : null;
    const pressure = ((rsi14[i] > 70 || prevRsi14 > 70) && wt1[i] > 60 && !yellowUp)
      ? 'negative'
      : ((rsi14[i] < 30 || prevRsi14 < 30) && wt1[i] < -60 && yellowUp)
        ? 'positive'
        : null;
    const alignSignal = allBull && !prevAllBull ? 'bull' : allBear && !prevAllBear ? 'bear' : null;
    const wtAlignSignal = wtCross && wtCrossUp && allBull ? 'bull' : wtCross && wtCrossDown && allBear ? 'bear' : null;
    prevAllBull = allBull;
    prevAllBear = allBear;
    return {tm1,tm2,tm3,tb1,tb2,trendCandle:trendCandle[i],allBull,allBear,alignSignal,wtAlignSignal,pressure};
  });

  const byIndex = new Map(rows.map((r,i)=>[r.i,rowPoints[i]]));
  const points = (bars||[]).map((_,i)=>byIndex.get(i) || {tm1:null,tm2:null,tm3:null,tb1:null,tb2:null});
  return {name:'Trend Meter',green:'#288a75',red:'#ff5252',points};
}

/* ── error boundary ──────────────────────────────────────────────────────── */
class ErrBound extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  componentDidCatch(e,i){console.error('Tab render error:',e,i);}
  render(){
    if(this.state.err) return (
      <div style={{padding:28,display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px',borderRadius:12,background:'rgba(255,180,171,0.07)',border:'1px solid rgba(255,180,171,0.28)'}}>
          <span className="mso" style={{fontSize:20,color:'#ffb4ab'}}>error</span>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'#ffb4ab'}}>Tab render error — check the browser console for details.</span>
        </div>
        <pre style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'#849495',whiteSpace:'pre-wrap',padding:'14px 18px',borderRadius:10,background:'rgba(14,14,15,0.5)',border:'1px solid rgba(132,148,149,0.16)',maxHeight:300,overflowY:'auto'}}>{String(this.state.err)}</pre>
        <button onClick={()=>this.setState({err:null})} style={{alignSelf:'flex-start',padding:'9px 20px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'#7df4ff',background:'rgba(125,244,255,0.08)',border:'1px solid rgba(125,244,255,0.3)'}}>Retry</button>
      </div>
    );
    return this.props.children;
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════════════════════ */
const NAV = [
  {id:'dashboard',  label:'Dashboard',          icon:'space_dashboard'},
  {id:'watchlist',  label:'Watchlist',          icon:'visibility'},
  {id:'preopen',    label:'Pre-Open',            icon:'wb_twilight'},
  {id:'screener',   label:'Market Screener',     icon:'radar'},
  {id:'intraday',   label:'Intraday',            icon:'monitoring'},
  {id:'strategy',   label:'Strategy',            icon:'insights'},
  {id:'crypto',     label:'Crypto',              icon:'currency_bitcoin'},
  {id:'orders',     label:'Orders Journal',      icon:'receipt_long'},
  {id:'forex',      label:'Forex',               icon:'currency_exchange'},
  {id:'trades',     label:'Trades & Positions',  icon:'swap_horiz'},
  {id:'forecast',   label:'Forecast',            icon:'calculate'},
  {id:'reports',    label:'Reports',             icon:'description'},
];
const PAGE_META = {
  orders:    {title:'Orders Journal',         sub:'Plan to fill to exit to trader review', crumb:'Orders Journal'},
  dashboard: {title:'Command Overview',       sub:'All systems nominal · scan cycle 5m · paper account', crumb:'Dashboard'},
  watchlist: {title:'Watchlist',              sub:'Current stock symbols · live-saved candles · daily change map', crumb:'Watchlist'},
  preopen:   {title:'Pre-Open Briefing',      sub:'Watchlist scanned · levels mapped · awaiting the open', crumb:'Pre-Open'},
  screener:  {title:'Market Screener',        sub:'LP1 / LP2 / PRB1 / PRB2 patterns on saved OHLCV', crumb:'Screener'},
  intraday:  {title:'Intraday Monitor',       sub:'Live decision loop · paper execution', crumb:'Intraday'},
  strategy:  {title:'Strategy Monitor',       sub:'BMSB weekly EMA/SMA cross scanner', crumb:'Strategy'},
  crypto:    {title:'Crypto Trade Levels',    sub:'OKX candles · trade zones · separate crypto bot', crumb:'Crypto'},
  forex:     {title:'Forex TradingView Bridge',sub:'TradingView alerts · IBKR CASH market execution', crumb:'Forex'},
  trades:    {title:'Trades & Positions',     sub:'Open paper positions and trade journal', crumb:'Trades'},
  forecast:  {title:'Risk Forecast Calculator',sub:'Scenario-only · replays saved data · no live orders', crumb:'Forecast'},
  reports:   {title:'Reports',               sub:'Generated session workbooks', crumb:'Reports'},
};

function App() {
  const [tab, setTab] = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(()=>{
    try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch { return false; }
  });
  const [meta, setMeta] = useState({clock:'—',session:'—',paper:true,dry_run:false});
  const [newsModal, setNewsModal] = useState(false);
  const [newsItems, setNewsItems] = useState([]);
  const [refreshKey, setRefreshKey] = useState(0);
  const [refreshBusy, setRefreshBusy] = useState(false);
  const [candleFetchBusy, setCandleFetchBusy] = useState(false);
  const [hardResetBusy, setHardResetBusy] = useState(false);

  useEffect(()=>{
    const refresh = ()=>fetch(`${API}/meta`).then(r=>r.json()).then(setMeta).catch(()=>{});
    refresh();
    const iv = setInterval(refresh, 5000);
    return ()=>clearInterval(iv);
  },[]);
  useEffect(()=>{
    const iv = setInterval(()=>setRefreshKey(key=>key+1), 30000);
    return ()=>clearInterval(iv);
  },[]);
  useEffect(()=>{
    try { localStorage.setItem('sidebarCollapsed', sidebarCollapsed ? '1' : '0'); } catch {}
  },[sidebarCollapsed]);

  const refreshDashboard = async()=>{
    if(refreshBusy) return;
    const stamp = Date.now();
    setRefreshBusy(true);
    try{
      const r = await fetch(`${API}/meta?refresh=${stamp}`, {cache:'no-store'});
      if(r.ok) setMeta(await r.json());
    }catch{}
    setRefreshKey(stamp);
    setTimeout(()=>setRefreshBusy(false), 450);
  };

  const hardResetDashboard = async()=>{
    const ok = window.confirm('Hard reset will close and reopen the dashboard server, market-data collector, execute worker, and crypto worker. Continue?');
    if(!ok) return;
    setHardResetBusy(true);
    try{
      const r = await fetch(`${API}/system/hard-reset`,{method:'POST'});
      const d = await r.json().catch(()=>({}));
      if(!r.ok || d.ok===false) throw new Error(d.detail || d.message || 'Hard reset failed');
      alert(d.message || 'Hard reset started. The dashboard will reopen in a few seconds.');
    }catch(e){
      alert(`Hard reset failed: ${e.message || e}`);
      setHardResetBusy(false);
    }
  };

  const fetchIbkrCandles = async()=>{
    if(candleFetchBusy) return;
    setCandleFetchBusy(true);
    try{
      const r = await fetch(`${API}/system/fetch-ibkr-candles`,{method:'POST'});
      const d = await r.json().catch(()=>({}));
      if(!r.ok || d.ok===false) throw new Error(d.detail || d.message || 'IBKR candle fetch failed');
      alert(d.message || `IBKR candle fetch queued. pid=${d.pid || '-'}`);
      setRefreshKey(Date.now());
    }catch(e){
      alert(`IBKR candle fetch failed: ${e.message || e}`);
    }finally{
      setTimeout(()=>setCandleFetchBusy(false), 1200);
    }
  };

  const pm = PAGE_META[tab];
  const marketOk = meta.session==='OPEN';

  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden',
      background:`radial-gradient(900px 460px at 82% -8%, ${R(C.cyanBright,0.06)}, transparent 60%), radial-gradient(700px 400px at 8% 110%, ${R(C.lime,0.04)}, transparent 60%), ${C.bg}`,
      color:C.onSurf, fontFamily:"'Inter',sans-serif", WebkitFontSmoothing:'antialiased'}}>

      {/* ── Sidebar ─────────────────────────────────────────────────────── */}
      <aside style={{flexShrink:0,width:sidebarCollapsed?74:256,height:'100%',background:'rgba(14,14,15,0.92)',borderRight:`1px solid ${R(C.outline,0.16)}`,display:'flex',flexDirection:'column',padding:sidebarCollapsed?'18px 10px':'22px 16px',overflowY:'auto',overflowX:'hidden',transition:'width .18s ease,padding .18s ease'}}>
        {/* Brand */}
        <div style={{display:'flex',alignItems:'center',justifyContent:sidebarCollapsed?'center':'space-between',gap:11,padding:sidebarCollapsed?'0 0 16px':'0 6px 22px',borderBottom:`1px solid ${R(C.outline,0.12)}`,marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
          <div style={{width:36,height:36,borderRadius:9,flexShrink:0,background:'linear-gradient(140deg,#00f0ff,#006970)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 18px rgba(0,240,255,0.35)'}}>
            <Icon n="candlestick_chart" size={20} color="#001416"/>
          </div>
          {!sidebarCollapsed && <div style={{minWidth:0}}>
            <div style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:17,fontWeight:600,color:'#dbfcff',lineHeight:1.1}}>Vitaly's Trading Bot</div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline,marginTop:2}}>IBKR · {meta.paper?'PAPER':'LIVE'}</div>
          </div>}
          </div>
          {!sidebarCollapsed && (
            <button onClick={()=>setSidebarCollapsed(true)} title="Collapse sidebar"
              style={{width:30,height:30,borderRadius:8,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',background:R(C.outline,0.07),border:`1px solid ${R(C.outline,0.18)}`,color:C.onVar,flexShrink:0}}>
              <Icon n="keyboard_double_arrow_left" size={18} color="inherit"/>
            </button>
          )}
        </div>

        {/* Nav */}
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:4}}>
          {NAV.map(n=>{
            const a=n.id===tab;
            return (
              <div key={n.id} onClick={()=>setTab(n.id)} title={sidebarCollapsed?n.label:undefined}
                style={{display:'flex',alignItems:'center',justifyContent:sidebarCollapsed?'center':'flex-start',gap:12,padding:sidebarCollapsed?'11px 0':'11px 14px',borderRadius:8,cursor:'pointer',transition:'all .15s',
                  borderRight:`3px solid ${a?C.cyan:'transparent'}`,
                  background:a?R(C.cyan,0.10):'transparent',
                  color:a?C.cyan:C.onVar}}
                onMouseEnter={e=>{if(!a)e.currentTarget.style.background='rgba(255,255,255,0.05)'}}
                onMouseLeave={e=>{if(!a)e.currentTarget.style.background='transparent'}}>
                <Icon n={n.icon} size={20} color={a?C.cyan:C.onVar} style={{fontVariationSettings:a?`'FILL' 1`:`'FILL' 0`}}/>
                {!sidebarCollapsed && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.03em',whiteSpace:'nowrap'}}>{n.label}</span>}
              </div>
            );
          })}
        </div>

        {/* Safety box */}
        {sidebarCollapsed ? (
          <button onClick={()=>setSidebarCollapsed(false)} title="Expand sidebar"
            style={{marginTop:14,width:'100%',height:38,borderRadius:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',background:R(C.cyan,0.08),border:`1px solid ${R(C.cyan,0.24)}`,color:C.cyan}}>
            <Icon n="keyboard_double_arrow_right" size={20} color="inherit"/>
          </button>
        ) : <div style={{marginTop:14,padding:'13px 14px',borderRadius:10,background:'rgba(28,27,28,0.7)',border:`1px solid ${R(C.outline,0.14)}`}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <PulseDot color={C.lime} size={7} shadow={8}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onSurf}}>Read-only mode</span>
          </div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginTop:6,lineHeight:1.5}}>Never connects to IBKR.<br/>Views <span style={{color:C.onVar}}>memory/</span> only.</div>
        </div>}

        {/* Footer */}
        {!sidebarCollapsed && <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${R(C.outline,0.14)}`,display:'flex',flexDirection:'column',gap:2}}>
          {[{icon:'help',label:'Docs'},{icon:'settings',label:'Settings'}].map(f=>(
            <div key={f.label} style={{display:'flex',alignItems:'center',gap:11,padding:'8px 14px',borderRadius:8,cursor:'pointer',color:C.onVar,fontFamily:"'JetBrains Mono',monospace",fontSize:11}}
              onMouseEnter={e=>e.currentTarget.style.color=C.onSurf}
              onMouseLeave={e=>e.currentTarget.style.color=C.onVar}>
              <Icon n={f.icon} size={18} color="inherit"/>
              {f.label}
            </div>
          ))}
        </div>}
      </aside>

      {/* ── Main ────────────────────────────────────────────────────────── */}
      <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',height:'100%'}}>
        {/* Header */}
        <header style={{flexShrink:0,height:62,borderBottom:`1px solid ${R(C.outline,0.16)}`,background:'rgba(19,19,20,0.7)',backdropFilter:'blur(12px)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,padding:'0 26px',overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.06em',color:C.outline}}>
            <span>OPERATIONS DESK</span>
            <span style={{color:C.outlineVar}}>/</span>
            <span style={{color:C.onVar,textTransform:'uppercase'}}>{pm.crumb}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            {/* SYNCED clock */}
            <div style={{display:'flex',alignItems:'center',gap:7,padding:'6px 11px',borderRadius:8,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(C.outline,0.16)}`}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:C.cyanBright,boxShadow:`0 0 7px ${C.cyanBright}`,animation:'pulse 1.8s infinite',display:'inline-block'}}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onVar}}>SYNCED {meta.clock} ET</span>
            </div>
            {/* PAPER badge */}
            <div style={{padding:'6px 11px',borderRadius:8,fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.05em',color:'#7df4ff',background:R(C.cyan,0.1),border:`1px solid ${R(C.cyan,0.28)}`}}>
              {meta.paper?'PAPER · READ-ONLY':'LIVE'}
            </div>
            {/* Market status */}
            <div style={{display:'flex',alignItems:'center',gap:7,padding:'6px 11px',borderRadius:8,background:marketOk?R(C.lime,0.06):'rgba(28,27,28,0.8)',border:`1px solid ${marketOk?R(C.lime,0.28):R(C.outline,0.16)}`}}>
              <Icon n={marketOk?'check_circle':'schedule'} size={15} color={marketOk?C.lime:C.onVar}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:marketOk?C.lime:C.onVar}}>Market {meta.session}</span>
            </div>
            {/* Refresh */}
            <button onClick={fetchIbkrCandles} disabled={candleFetchBusy}
              title="Fetch latest IBKR candle data now"
              style={{height:34,padding:'0 11px',borderRadius:8,display:'flex',alignItems:'center',gap:7,cursor:candleFetchBusy?'wait':'pointer',color:candleFetchBusy?C.cyan:C.lime,background:R(C.lime,0.07),border:`1px solid ${R(candleFetchBusy?C.cyan:C.lime,candleFetchBusy?0.34:0.24)}`,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800,letterSpacing:'0.04em'}}
              onMouseEnter={e=>{if(!candleFetchBusy)e.currentTarget.style.color=C.cyan}}
              onMouseLeave={e=>{if(!candleFetchBusy)e.currentTarget.style.color=C.lime}}>
              <Icon n="cloud_download" size={16} color="inherit" style={{animation:candleFetchBusy?'spin .8s linear infinite':undefined}}/>
              {candleFetchBusy?'FETCHING':'FETCH CANDLES'}
            </button>
            <button onClick={refreshDashboard} disabled={refreshBusy}
              title="Refresh dashboard data"
              style={{height:34,padding:'0 11px',borderRadius:8,display:'flex',alignItems:'center',gap:7,cursor:refreshBusy?'wait':'pointer',color:refreshBusy?C.cyan:C.onVar,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(refreshBusy?C.cyan:C.outline,refreshBusy?0.34:0.16)}`,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800,letterSpacing:'0.04em'}}
              onMouseEnter={e=>{if(!refreshBusy)e.currentTarget.style.color=C.cyan}}
              onMouseLeave={e=>{if(!refreshBusy)e.currentTarget.style.color=C.onVar}}>
              <Icon n="refresh" size={16} color="inherit" style={{animation:refreshBusy?'spin .8s linear infinite':undefined}}/>
              {refreshBusy?'REFRESHING':'REFRESH'}
            </button>
            {/* Hard reset */}
            <button onClick={hardResetDashboard} disabled={hardResetBusy}
              title="Close and reopen dashboard services"
              style={{height:34,padding:'0 12px',borderRadius:8,display:'flex',alignItems:'center',gap:7,cursor:hardResetBusy?'wait':'pointer',color:hardResetBusy?C.outline:C.err,background:R(C.err,0.08),border:`1px solid ${R(C.err,0.28)}`,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800,letterSpacing:'0.04em'}}>
              <Icon n="restart_alt" size={16} color="inherit"/>
              {hardResetBusy?'RESETTING':'HARD RESET'}
            </button>
          </div>
        </header>

        {/* Scrollable content */}
        <div style={{flex:1,overflowY:'auto',overflowX:'hidden',padding:28}}>
          <div style={{maxWidth:1440,margin:'0 auto'}}>
            {/* Page hero */}
            <div style={{display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'flex-end',gap:14,marginBottom:26}}>
              <div>
                <h1 style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:32,fontWeight:600,letterSpacing:'-0.01em',color:C.onSurf}}>{pm.title}</h1>
                <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline,marginTop:7,display:'flex',alignItems:'center',gap:8}}>
                  <PulseDot color={C.lime} size={7}/>
                  {pm.sub}
                </p>
              </div>
            </div>

            {/* Tab content */}
            <ErrBound key={tab}>
              {tab==='dashboard' && <TabDashboard setNewsModal={setNewsModal} setNewsItems={setNewsItems} refreshKey={refreshKey}/>}
              {tab==='watchlist' && <TabWatchlist refreshKey={refreshKey}/>}
              {tab==='preopen'   && <TabPreOpen refreshKey={refreshKey}/>}
              {tab==='screener'  && <TabMarketScreener refreshKey={refreshKey}/>}
              {tab==='intraday'  && <TabIntraday refreshKey={refreshKey}/>}
              {tab==='strategy'  && <TabStrategy refreshKey={refreshKey}/>}
              {tab==='crypto'    && <TabCrypto refreshKey={refreshKey}/>}
              {tab==='orders'    && <TabOrdersJournal refreshKey={refreshKey}/>}
              {tab==='forex'     && <TabForex refreshKey={refreshKey}/>}
              {tab==='trades'    && <TabTrades refreshKey={refreshKey}/>}
              {tab==='forecast'  && <TabForecast refreshKey={refreshKey}/>}
              {tab==='reports'   && <TabReports refreshKey={refreshKey}/>}
            </ErrBound>
          </div>
        </div>
      </main>
      {newsModal && <NewsModal items={newsItems} onClose={()=>setNewsModal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
