        ) : <div style={{padding:'20px 18px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>No order requests yet.</div>}
      </GlassCard>

      {/* Trade Journal */}
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="menu_book" title="Recent Trade Journal"/>
        <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:10}}>
          {trade_log?.length>0 ? trade_log.map((s,i)=>(
            <details key={i} style={{borderRadius:8,border:`1px solid ${R(C.outline,0.14)}`,overflow:'hidden'}}>
              <summary style={{padding:'10px 14px',cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar,background:R(C.surfLowest,0.4)}}>{s.heading}</summary>
              <pre style={{padding:'12px 14px',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.outline,overflowX:'auto',whiteSpace:'pre-wrap',margin:0}}>{s.body||'(empty)'}</pre>
            </details>
          )) : <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>No trade log sections available.</span>}
        </div>
      </GlassCard>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   TAB: FORECAST
═══════════════════════════════════════════════════════════════════════════ */
const FC_DEFAULTS = {
  equity:1000, cash:1000, dailyPnl:0, spread:0.05,
  riskTrade:1.0, maxDailyLoss:2.0, minRR:3.0, maxPositions:5,
  maxSpread:0.20, maxOpenRisk:6.0, maxPosValue:1000, minEntryAtr:0.25, maxEntryAtr:2.0,
};

function TabForecast({refreshKey=0}) {
  const forecastChartFullscreenRef = useRef(null);
  const [fc, setFc] = useState(FC_DEFAULTS);
  const [result, setResult] = useState(null);
  const [calcAt, setCalcAt] = useState('—');
  const [loading, setLoading] = useState(false);
  const [fcFilter, setFcFilter] = useState('eligible');
  const [fcLedgerSymbol, setFcLedgerSymbol] = useState('');
  const [fcExpanded, setFcExpanded] = useState(false);
  const [fcSel, setFcSel] = useState(null);
  const [fcSelKey, setFcSelKey] = useState(null);
  const [feedback, setFeedback] = useState(null);   // {ok, message, id} or null
  const [confirm, setConfirm] = useState(null);     // {type:'place'|'close', row} pending user confirmation
  const [qtyOverrides, setQtyOverrides] = useState({});  // index -> qty string while editing
  const setQtyOverride = (i, val) => setQtyOverrides(prev => ({...prev, [i]: val}));
  const forecastRowKey = useCallback((r)=>[
    r?.symbol||'',
    r?.source||'',
    r?.strategy||'',
    r?.signal||'',
    Number(r?.entry||0).toFixed(4),
    Number(r?.stop||0).toFixed(4),
    Number(r?.target||0).toFixed(4),
    Number(r?.reward_risk||0).toFixed(4),
  ].join('|'),[]);

  const doPlace = useCallback(async(row) => {
    setConfirm(null);
    try {
      const r = await fetch(`${API}/order/place`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});
      const d = await r.json();
      setFeedback({ok:d.ok, message:d.message, id:d.id, dryRun:d.dry_run});
    } catch(e) { setFeedback({ok:false, message:'Network error: '+e.message}); }
  },[]);

  const doClose = useCallback(async(symbol) => {
    setConfirm(null);
    try {
      const r = await fetch(`${API}/order/close`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol})});
      const d = await r.json();
      setFeedback({ok:d.ok, message:d.message, id:d.id, dryRun:d.dry_run});
    } catch(e) { setFeedback({ok:false, message:'Network error: '+e.message}); }
  },[]);
  const [showVol, setShowVol] = useState(true);
  const [showRaw, setShowRaw] = useState(false);
  const [showTrade, setShowTrade] = useState(true);
  const [showStrategy, setShowStrategy] = useState(false);
  const [showStrategy2, setShowStrategy2] = useState(false);
  const [showGaussian, setShowGaussian] = useState(false);
  const [showGaussianSignals, setShowGaussianSignals] = useState(false);
  const [selBars, setSelBars] = useState([]);
  const [selBarsInfo, setSelBarsInfo] = useState({stale:false,lastDate:null});
  const [tf, setTf] = useState('1D');
  const [fcChartRange, setFcChartRange] = useState('ALL');
  const [fcSetupDraft, setFcSetupDraft] = useState({key:null,entry:'',stop:'',target:'',rr:'',rrLocked:false});
  const [fcOrderType, setFcOrderType] = useState('LMT');
  const [fcSetupQty, setFcSetupQty] = useState({key:null,value:''});

  const runCalc = useCallback(async(inputs)=>{
    setLoading(true);
    try {
      const r = await fetch(`${API}/forecast/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(inputs)});
      const d = await r.json();
      setResult(d);
      const now=new Date(); const p=n=>String(n).padStart(2,'0');
      setCalcAt(`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`);
      const firstRow = d.accepted?.[0] || d.rows?.[0] || null;
      setFcSel(s=>s || firstRow?.symbol || null);
      setFcSelKey(k=>k || (firstRow ? forecastRowKey(firstRow) : null));
    } finally { setLoading(false); }
  },[forecastRowKey]);

  useEffect(()=>{ runCalc(FC_DEFAULTS); },[]);

  const [selPlan, setSelPlan] = useState(null);

  useEffect(()=>{
    if(!fcSel) return;
    const apitf = TF_API[tf]||'daily';
    fetch(`${API}/bars/${fcSel}/${apitf}`).then(r=>r.json()).then(d=>{setSelBars(d.bars||[]);setSelBarsInfo({stale:d.stale,lastDate:d.last_date});});
    fetch(`${API}/preopen/${fcSel}`).then(r=>r.json()).then(setSelPlan).catch(()=>setSelPlan(null));
  },[fcSel, tf, refreshKey]);

  const money = n => '$'+Math.round(n||0).toLocaleString('en-US');
  const fmtP2 = v => v!=null ? `$${Number(v).toFixed(2)}` : '—';
  const sum = result?.summary||{};
  const rows = result?.rows||[];

  const forecastSymbols = [...new Set(rows.map(r=>r.symbol).filter(Boolean))].sort();
  const ledgerBase = fcFilter==='eligible'?rows.filter(r=>r.status==='FORECAST TRADE')
    :fcFilter==='filtered'?rows.filter(r=>r.status!=='FORECAST TRADE'):rows;
  const ledgerSrc = fcFilter==='all' && fcLedgerSymbol
    ? ledgerBase.filter(r=>r.symbol===fcLedgerSymbol)
    : ledgerBase;
  const selRow = (fcSelKey ? rows.find(r=>forecastRowKey(r)===fcSelKey) : null)
    || rows.find(r=>r.symbol===fcSel)
    || rows[0]
    || null;
  const selectedForecastKey = selRow ? forecastRowKey(selRow) : null;

  useEffect(()=>{
    if(!selRow || !selectedForecastKey) return;
    setFcSetupDraft(prev=>{
      if(prev.key===selectedForecastKey) return prev;
      return {
        key:selectedForecastKey,
        entry:Number(selRow.entry||0)>0 ? Number(selRow.entry||0).toFixed(2) : '',
        stop:Number(selRow.stop||0)>0 ? Number(selRow.stop||0).toFixed(2) : '',
        target:Number(selRow.target||0)>0 ? Number(selRow.target||0).toFixed(2) : '',
        rr:Number(selRow.reward_risk||0)>0 ? Number(selRow.reward_risk||0).toFixed(2) : '',
        rrLocked:false,
      };
    });
    setFcSetupQty(prev=>{
      if(prev.key===selectedForecastKey) return prev;
      return {key:selectedForecastKey,value:String(Math.max(0,Math.floor(Number(selRow.quantity||0)||0)))};
    });
  },[selectedForecastKey, selRow]);

  const forecastIsBuy = String(selRow?.signal||'BUY').toUpperCase()==='BUY';
  const fmtForecastInput = useCallback((v)=>{
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? n.toFixed(2) : '';
  },[]);
  const getForecastDistances = useCallback((draft)=>{
    const entry = Number(draft?.entry);
    const stop = Number(draft?.stop);
    const target = Number(draft?.target);
    const rowEntry = Number(selRow?.entry);
    const rowStop = Number(selRow?.stop);
    const rowTarget = Number(selRow?.target);
    const rowRr = Number(selRow?.reward_risk);
    let risk = Number.isFinite(entry) && entry > 0 && Number.isFinite(stop) && stop > 0
      ? Math.abs(entry - stop)
      : NaN;
    let reward = Number.isFinite(entry) && entry > 0 && Number.isFinite(target) && target > 0
      ? Math.abs(target - entry)
      : NaN;
    if(!Number.isFinite(risk) || risk <= 0){
      risk = Number.isFinite(rowEntry) && rowEntry > 0 && Number.isFinite(rowStop) && rowStop > 0
        ? Math.abs(rowEntry - rowStop)
        : NaN;
    }
    if(!Number.isFinite(reward) || reward <= 0){
      reward = Number.isFinite(rowEntry) && rowEntry > 0 && Number.isFinite(rowTarget) && rowTarget > 0
        ? Math.abs(rowTarget - rowEntry)
        : NaN;
    }
    if((!Number.isFinite(reward) || reward <= 0) && Number.isFinite(risk) && risk > 0 && Number.isFinite(rowRr) && rowRr > 0){
      reward = risk * rowRr;
    }
    return {risk, reward};
  },[selRow]);
  const applyForecastEntryChange = useCallback((value)=>{
    setFcSetupDraft(d=>{
      const entry = Number(value);
      if(!Number.isFinite(entry) || entry <= 0) return {...d, entry:value};
      const {risk, reward} = getForecastDistances(d);
      const rr = Number(d.rr);
      const nextStop = Number.isFinite(risk) && risk > 0
        ? (forecastIsBuy ? entry - risk : entry + risk)
        : Number(d.stop);
      const nextTarget = d.rrLocked && Number.isFinite(rr) && rr > 0 && Number.isFinite(nextStop) && nextStop > 0
        ? (forecastIsBuy ? entry + Math.abs(entry-nextStop)*rr : entry - Math.abs(entry-nextStop)*rr)
        : (Number.isFinite(reward) && reward > 0 ? (forecastIsBuy ? entry + reward : entry - reward) : Number(d.target));
      return {
        ...d,
        entry:value,
        stop:Number.isFinite(nextStop) && nextStop > 0 ? fmtForecastInput(nextStop) : d.stop,
        target:Number.isFinite(nextTarget) && nextTarget > 0 ? fmtForecastInput(nextTarget) : d.target,
      };
    });
  },[forecastIsBuy, fmtForecastInput, getForecastDistances]);
  const applyForecastStopChange = useCallback((value)=>{
    setFcSetupDraft(d=>{
      const entry = Number(d.entry);
      const stop = Number(value);
      const rr = Number(d.rr);
      if(!d.rrLocked || !Number.isFinite(entry) || entry <= 0 || !Number.isFinite(stop) || stop <= 0 || !Number.isFinite(rr) || rr <= 0){
        return {...d, stop:value};
      }
      const target = forecastIsBuy ? entry + Math.abs(entry-stop)*rr : entry - Math.abs(entry-stop)*rr;
      return {...d, stop:value, target:Number.isFinite(target) && target > 0 ? fmtForecastInput(target) : d.target};
    });
  },[forecastIsBuy, fmtForecastInput]);
  const applyForecastTargetChange = useCallback((value)=>{
    setFcSetupDraft(d=>({...d, target:value, rrLocked:false, rr:''}));
  },[]);
  const applyForecastRrChange = useCallback((value)=>{
    setFcSetupDraft(d=>{
      const rr = Number(value);
      const entry = Number(d.entry);
      const stop = Number(d.stop);
      if(!value || !Number.isFinite(rr) || rr <= 0 || !Number.isFinite(entry) || entry <= 0 || !Number.isFinite(stop) || stop <= 0){
        return {...d, rr:value, rrLocked:Boolean(value)};
      }
      const target = forecastIsBuy ? entry + Math.abs(entry-stop)*rr : entry - Math.abs(entry-stop)*rr;
      return {
        ...d,
        rr:value,
        rrLocked:true,
        target:Number.isFinite(target) && target > 0 ? fmtForecastInput(target) : d.target,
      };
    });
  },[forecastIsBuy, fmtForecastInput]);

  const fcSetup = useMemo(()=>{
    if(!selRow) return null;
    const entry=Number(fcSetupDraft.entry);
    const stop=Number(fcSetupDraft.stop);
    const rrInput=Number(fcSetupDraft.rr);
    const targetInput=Number(fcSetupDraft.target);
    if(!Number.isFinite(entry)||entry<=0||!Number.isFinite(stop)||stop<=0) return null;
    const isBuy=String(selRow.signal||'BUY').toUpperCase()==='BUY';
    const riskPerShare=Math.abs(entry-stop);
    if(riskPerShare<=0) return null;
    const target=fcSetupDraft.rrLocked && Number.isFinite(rrInput) && rrInput>0
      ? (isBuy ? entry + riskPerShare*rrInput : entry - riskPerShare*rrInput)
      : targetInput;
    if(!Number.isFinite(target)||target<=0) return null;
    const validDirection=isBuy ? stop<entry && target>entry : stop>entry && target<entry;
    if(!validDirection) return null;
    const rewardPerShare=Math.abs(target-entry);
    if(rewardPerShare<=0) return null;
    const qtyValue = fcSetupQty.key===selectedForecastKey ? fcSetupQty.value : selRow.quantity;
    const quantity=Math.max(0,Math.floor(Number(qtyValue)||0));
    const rr=rewardPerShare/riskPerShare;
    return {
      symbol:selRow.symbol,
      signal:selRow.signal,
      entry,
      stop,
      target,
      reward_risk:rr,
      quantity,
      risk_amount:quantity*riskPerShare,
      potential_reward:quantity*rewardPerShare,
      position_value:quantity*entry,
      risk_per_share:riskPerShare,
      reward_per_share:rewardPerShare,
      valid:true,
      row:{
        ...selRow,
        entry,
        stop,
        target,
        reward_risk:rr,
        quantity,
        risk_amount:quantity*riskPerShare,
        potential_reward:quantity*rewardPerShare,
        position_value:quantity*entry,
        entry_order_type:fcOrderType==='MKT'?'MARKET':'LIMIT',
        adjusted_from:'forecast_chart',
      },
    };
  },[selRow, selectedForecastKey, fcSetupDraft, fcOrderType, fcSetupQty]);

  const fcInputDefs = [
    {key:'equity',label:'Account equity',prefix:'$',suffix:'',step:5000},
    {key:'cash',label:'Available cash',prefix:'$',suffix:'',step:5000},
    {key:'dailyPnl',label:'Daily realized P&L',prefix:'$',suffix:'',step:100},
    {key:'spread',label:'Assumed spread',prefix:'',suffix:'%',step:0.01},
    {key:'riskTrade',label:'Risk / trade',prefix:'',suffix:'%',step:0.05},
    {key:'maxDailyLoss',label:'Max daily loss',prefix:'',suffix:'%',step:0.1},
    {key:'minRR',label:'Min reward:risk',prefix:'',suffix:':1',step:0.25},
    {key:'maxPositions',label:'Max positions',prefix:'',suffix:'',step:1},
    {key:'maxSpread',label:'Max spread',prefix:'',suffix:'%',step:0.01},
    {key:'maxOpenRisk',label:'Max open risk',prefix:'',suffix:'%',step:0.1},
    {key:'maxPosValue',label:'Max position value',prefix:'$',suffix:'',step:1000},
    {key:'minEntryAtr',label:'Min entry dist',prefix:'',suffix:'ATR',step:0.25},
    {key:'maxEntryAtr',label:'Max entry dist',prefix:'',suffix:'ATR',step:0.25},
  ];

  const selLines = fcSetup ? [
    {p:fcSetup.target,color:C.lime,label:`TARGET ${fmtP2(fcSetup.target)}`},
    {p:fcSetup.entry, color:C.ocean,label:`ENTRY ${fmtP2(fcSetup.entry)}`},
    {p:fcSetup.stop,  color:C.err, label:`STOP ${fmtP2(fcSetup.stop)}`},
  ].filter(Boolean) : [];
  const strategyOverlay = useMemo(
    ()=>{
      const count = RANGE_COUNTS[fcChartRange]||9999;
      const overlays = [
        showStrategy ? sliceOverlayPoints(buildBmsbStrategyOverlay(selBars), count) : null,
        showStrategy2 ? sliceOverlayPoints(buildBmsbStrategy2Overlay(selBars), count) : null,
      ].filter(Boolean);
      return overlays.length ? overlays : null;
    },
    [showStrategy, showStrategy2, selBars, fcChartRange]
  );
  const gaussianOverlay = useMemo(()=>{
    if(!showGaussian && !showGaussianSignals) return null;
    const full = buildGaussianChannelOverlay(selBars);
    return full ? {...full, showChannel:showGaussian, showSignals:showGaussianSignals, points: full.points.slice(-(RANGE_COUNTS[fcChartRange]||9999))} : null;
  },[showGaussian, showGaussianSignals, selBars, fcChartRange]);
  const visibleSelBars = selBars.slice(-(RANGE_COUNTS[fcChartRange]||9999));

  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {/* info banner */}
      <div style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 18px',borderRadius:12,background:R(C.cyan,0.06),border:`1px solid ${R(C.cyan,0.22)}`}}>
        <Icon n="shield_lock" size={20} color={C.cyan} style={{flexShrink:0}}/>
        <span style={{fontFamily:"'Inter',sans-serif",fontSize:13,lineHeight:1.6,color:C.onVar}}>
          This calculator replays saved market data and models conditional level setups. It does not change live bot settings, connect to IBKR, or place real orders — <span style={{color:C.cyan}}>scenario only</span>.
        </span>
      </div>

      {/* Scenario Parameters */}
      <GlassCard style={{overflow:'hidden'}}>
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <Icon n="calculate" size={17} color={C.outline}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>Scenario Parameters</span>
          </div>
          <span style={{padding:'3px 9px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.magenta,background:R(C.magenta,0.12),border:`1px solid ${R(C.magenta,0.3)}`}}>SCENARIO ONLY</span>
        </div>
        <div style={{padding:'22px 20px'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:16}}>
            {fcInputDefs.map(d=>(
              <label key={d.key} style={{display:'flex',flexDirection:'column',gap:7}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.04em',color:C.outline}}>{d.label}</span>
                <div style={{display:'flex',alignItems:'center',gap:6,padding:'9px 11px',borderRadius:8,background:R(C.surfLowest,0.65),border:`1px solid ${R(C.outline,0.2)}`}}>
                  {d.prefix && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>{d.prefix}</span>}
                  <input type="number" value={fc[d.key]} step={d.step}
                    onChange={e=>setFc(f=>({...f,[d.key]:e.target.value}))}
                    style={{flex:1,minWidth:0,background:'transparent',border:'none',outline:'none',color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:13}}/>
                  {d.suffix && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.outline}}>{d.suffix}</span>}
                </div>
              </label>
            ))}
          </div>
          <div style={{display:'flex',gap:12,marginTop:22,flexWrap:'wrap'}}>
            <button onClick={()=>runCalc(fc)} disabled={loading}
              style={{display:'flex',alignItems:'center',gap:8,padding:'11px 20px',borderRadius:9,border:`1px solid ${R(C.cyan,0.4)}`,background:R(C.cyan,0.14),color:C.cyan,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:500}}>
              <Icon n="query_stats" size={17} color={C.cyan}/>{loading?'Calculating…':'Calculate Forecast'}
            </button>
            <button onClick={()=>{setFc(FC_DEFAULTS);runCalc(FC_DEFAULTS);}}
              style={{display:'flex',alignItems:'center',gap:8,padding:'11px 18px',borderRadius:9,border:`1px solid ${R(C.outline,0.25)}`,background:'rgba(28,27,28,0.6)',color:C.onVar,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
              <Icon n="restart_alt" size={17} color={C.onVar}/>Reset to Live Settings
            </button>
          </div>
        </div>
      </GlassCard>

      {result && (<>
        {/* Forecast Summary */}
        <div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <Icon n="query_stats" size={17} color={C.outline}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>Forecast Summary</span>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,background:'rgba(28,27,28,0.7)',padding:'2px 8px',borderRadius:9999,border:`1px solid ${R(C.outline,0.16)}`}}>{calcAt}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:16}}>
            {[
              {label:'ATR-Qualified Setups', value:String(sum.setup_qualified??0), sub:`of ${sum.possible_signals??0} modeled signals`},
              {label:'Forecast Trades', value:String(sum.forecast_trades??0), valueColor:C.lime, sub:sum.binding_limit?`limited by ${sum.binding_limit}`:'eligible under scenario', subColor:C.lime},
              {label:'Capital Required', value:money(sum.capital_required), valueColor:C.cyan, sub:'forecast allocation', subColor:C.cyan},
              {label:'New Open Risk', value:money(sum.new_open_risk), sub:`max ${money(sum.max_open_risk)}`},
              {label:'Max Daily Loss', value:money(sum.max_daily_loss), valueColor:C.err, sub:`${money(sum.remaining_daily_loss)} remaining`, subColor:C.err},
              {label:'Potential Reward', value:money(sum.potential_reward), valueColor:C.lime, sub:'at modeled targets', subColor:C.lime},
            ].map((m,i)=>(
              <GlassCard key={i} style={{padding:18,display:'flex',flexDirection:'column',gap:12}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,letterSpacing:'0.04em',color:C.onVar}}>{m.label}</span>
                <div style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:30,fontWeight:600,lineHeight:1,color:m.valueColor||C.onSurf}}>{m.value}</div>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:m.subColor||C.onVar}}>{m.sub}</div>
              </GlassCard>
            ))}
          </div>
          {sum.binding_limit && (
            <div style={{display:'flex',alignItems:'flex-start',gap:11,marginTop:16,padding:'14px 18px',borderRadius:11,background:R(C.lime,0.05),border:`1px solid ${R(C.lime,0.22)}`}}>
              <Icon n="info" size={19} color={C.lime} style={{flexShrink:0}}/>
              <span style={{fontFamily:"'Inter',sans-serif",fontSize:13,lineHeight:1.6,color:C.onVar}}>
                {sum.setup_qualified} setups pass the signal and ATR filters, but the portfolio receives {sum.forecast_trades} trade(s). Binding constraint: <strong style={{color:C.onSurf}}>{sum.binding_limit}</strong>. Risk budget per trade is {money(sum.risk_budget_per_trade)}; remaining open-risk capacity supports {sum.open_risk_capacity} full-sized position(s), across {sum.position_capacity} available slot(s).
              </span>
            </div>
          )}
        </div>

        {/* Gauges + Scatter */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:16}}>
          <GlassCard style={{padding:20}}>
            <h3 style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar,marginBottom:18,display:'flex',alignItems:'center',gap:9}}>
              <Icon n="speed" size={16} color={C.outline}/>Capital &amp; Risk Utilization
            </h3>
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              <Gauge label="Capital deployed" used={sum.capital_required||0} cap={Number(fc.cash)} color={C.cyan} sub={`${money((Number(fc.cash))-(sum.capital_required||0))} cash free`}/>
              <Gauge label="Open risk" used={sum.total_open_risk||0} cap={sum.max_open_risk||1} color={C.lime} sub={`incl. ${money(sum.current_open_risk)} from open positions`}/>
              <Gauge label="Daily loss budget" used={Math.max(0,-(Number(fc.dailyPnl)||0))} cap={sum.max_daily_loss||1} color={C.err} sub={`${money(sum.remaining_daily_loss)} remaining before kill switch`}/>
            </div>
          </GlassCard>
          <GlassCard style={{padding:20}}>
            <h3 style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar,marginBottom:6,display:'flex',alignItems:'center',gap:9}}>
              <Icon n="scatter_plot" size={16} color={C.outline}/>Setup Qualification Map
            </h3>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginBottom:14}}>Reward:risk vs entry distance · X-axis focuses on forecast/ATR-qualified candidates · filtered symbols are faint background density</div>
            <FcScatter rows={rows} sc={{minRR:Number(fc.minRR),minEntryAtr:Number(fc.minEntryAtr),maxEntryAtr:Number(fc.maxEntryAtr)}}/>
          </GlassCard>
        </div>

        {/* Forecast Ledger */}
        <GlassCard style={{overflow:'hidden'}}>
          <div style={{padding:'16px 20px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Icon n="table_view" size={17} color={C.outline}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>Forecast Trade Ledger</span>
            </div>
            <span style={{padding:'3px 10px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.cyan,background:R(C.cyan,0.1),border:`1px solid ${R(C.cyan,0.28)}`}}>PAPER</span>
          </div>
          <div style={{padding:'18px 20px'}}>
            <p style={{fontFamily:"'Inter',sans-serif",fontSize:12,lineHeight:1.6,color:C.outline,marginBottom:16}}>
              Each row has <span style={{color:C.onVar}}>Place Order</span> (sends the setup to the execute_requests worker — paper-only, respects DRY_RUN) and <span style={{color:C.onVar}}>Close Position</span> (flattens the symbol).
            </p>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginBottom:18,flexWrap:'wrap'}}>
              <div style={{display:'inline-flex',gap:4,padding:4,borderRadius:9,background:R(C.surfLowest,0.6),border:`1px solid ${R(C.outline,0.16)}`,flexWrap:'wrap'}}>
                {[{id:'eligible',label:'Eligible trades'},{id:'all',label:'All signals'},{id:'filtered',label:'Filtered only'}].map(f=>{
                  const a=f.id===fcFilter;
                  return <button key={f.id} onClick={()=>setFcFilter(f.id)} style={{padding:'7px 14px',borderRadius:7,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,border:`1px solid ${a?R(C.cyan,0.4):'transparent'}`,background:a?R(C.cyan,0.14):'transparent',color:a?C.cyan:C.onVar}}>{f.label}</button>;
                })}
              </div>
              {fcFilter==='all' && (
                <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline,textTransform:'uppercase'}}>Ledger Symbol</span>
                  <select value={fcLedgerSymbol} onChange={e=>{setFcLedgerSymbol(e.target.value); setFcSelKey(null); if(e.target.value) setFcSel(e.target.value);}}
                    style={{minWidth:180,background:R(C.surfLowest,0.8),color:C.onSurf,border:`1px solid ${R(C.outline,0.25)}`,borderRadius:8,padding:'8px 11px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.04em'}}>
                    <option value="">All symbols</option>
                    {forecastSymbols.map(symbol=><option key={symbol} value={symbol}>{symbol}</option>)}
                  </select>
                  {fcLedgerSymbol && <Pill text={`FILTER: ${fcLedgerSymbol}`} color={C.cyan}/>}
                </div>
              )}
            </div>
            {feedback && (
              <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:16,padding:'12px 16px',borderRadius:10,
                background:feedback.ok?R(C.lime,0.07):R(C.err,0.07),
                border:`1px solid ${feedback.ok?R(C.lime,0.25):R(C.err,0.25)}`}}>
                <Icon n={feedback.ok?'task_alt':'error'} size={18} color={feedback.ok?C.lime:C.err} style={{flexShrink:0}}/>
                <div style={{flex:1}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'11.5px',lineHeight:1.5,color:feedback.ok?'#dbe9b0':C.err}}>{feedback.message}</span>
                  {feedback.id && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginLeft:12}}>ID: {feedback.id}</span>}
                  {feedback.dryRun && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.magenta,marginLeft:12}}>DRY_RUN — no real order sent</span>}
                </div>
                <button onClick={()=>setFeedback(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.outline,padding:4}}>
                  <Icon n="close" size={16} color={C.outline}/>
                </button>
              </div>
            )}
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',minWidth:780}}>
                <thead><tr>{['Symbol','Side','Entry','Stop','Target','R:R','Shares','Risk $','Pot. Reward','Status','Reason','Actions'].map(c=>(
                  <th key={c} style={{padding:'11px 16px',textAlign:c==='Actions'?'right':'left',fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',textTransform:'uppercase',color:C.outline,borderBottom:`1px solid ${R(C.outline,0.12)}`,whiteSpace:'nowrap'}}>{c}</th>
                ))}</tr></thead>
                <tbody>{ledgerSrc.map((r,i)=>{
                  const filtered=r.status!=='FORECAST TRADE';
                  const rr=Number(r.reward_risk||0);
                  const rrOk=rr>=Number(fc.minRR);
                  const sc=r.signal==='BUY'?C.lime:C.err;
                  const qtyRaw = i in qtyOverrides ? qtyOverrides[i] : String(r.quantity||0);
                  const qty=Math.max(0, Math.floor(Number(qtyRaw)||0));
                  const qtyEdited = qty !== Number(r.quantity||0);
                  const entry=Number(r.entry||0), stop=Number(r.stop||0), target=Number(r.target||0);
                  const riskDollar=qty>0&&stop>0 ? qty*Math.abs(entry-stop) : null;
                  const rewardDollar=qty>0&&target>0 ? qty*Math.abs(target-entry) : null;
                  return (
                    <tr key={i} onMouseEnter={e=>e.currentTarget.style.background=R('#fff',0.025)} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`}}>
                        <button onClick={()=>{setFcSel(r.symbol);setFcSelKey(forecastRowKey(r));}} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'7px 15px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:500,color:forecastRowKey(r)===fcSelKey?'#001416':C.onSurf,background:forecastRowKey(r)===fcSelKey?C.cyan:'rgba(20,20,21,0.7)',border:`1px solid ${forecastRowKey(r)===fcSelKey?C.cyan:'rgba(132,148,149,0.22)'}`}}>{r.symbol}</button>
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:sc,fontWeight:500}}>{r.signal}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.onVar}}>${entry.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.outline}}>${stop.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.outline}}>${target.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:rrOk?C.lime:C.outline}}>{rr.toFixed(2)}</td>
                      <td style={{padding:'8px 16px',borderBottom:`1px solid ${R(C.outline,0.06)}`}}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <input
                            type="number" min="0" step="1"
                            value={qtyRaw}
                            onChange={e=>setQtyOverride(i, e.target.value)}
                            onBlur={e=>{ const v=Math.max(0,Math.floor(Number(e.target.value)||0)); setQtyOverride(i,String(v)); }}
                            style={{width:70,padding:'5px 8px',borderRadius:7,fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                              color:qtyEdited?C.cyan:C.onVar,
                              background:qtyEdited?R(C.cyan,0.08):'rgba(28,27,28,0.7)',
                              border:`1px solid ${qtyEdited?R(C.cyan,0.4):R(C.outline,0.22)}`,
                              outline:'none',textAlign:'right'}}
                          />
                          {qtyEdited&&<button title="Reset to calculated" onClick={()=>setQtyOverride(i,String(r.quantity||0))}
                            style={{background:'none',border:'none',cursor:'pointer',padding:2,color:C.outline,lineHeight:1}}>
                            <Icon n="restart_alt" size={14} color={C.outline}/>
                          </button>}
                        </div>
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:riskDollar!=null?C.err:C.outline,fontWeight:500}}>{riskDollar!=null?`$${riskDollar.toFixed(2)}`:'—'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:rewardDollar!=null?C.lime:C.outline,fontWeight:500}}>{rewardDollar!=null?`$${rewardDollar.toFixed(2)}`:'—'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:filtered?C.outline:C.lime}}>{filtered?'Filtered':'Eligible'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,maxWidth:260}}>
                        {filtered ? (
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {(r.reason_codes&&r.reason_codes.length?r.reason_codes:[r.reason||'filtered']).map((code,ci)=>{
                              const labels={'daily_loss_limit_reached':'Daily loss limit','entry_too_close_to_market':'Entry too close','entry_too_far_from_market':'Entry too far','duplicate_position':'Duplicate position','max_positions_reached':'Max positions','reward_risk_too_low':'R:R too low','spread_too_wide':'Spread too wide','position_size_zero':'Size = 0','position_value_invalid':'Position value','open_risk_limit_exceeded':'Open risk limit'};
                              const label=labels[code]||(typeof code==='string'?code.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):String(code));
                              return <span key={ci} style={{display:'inline-block',padding:'2px 8px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.err,background:R(C.err,0.10),border:`1px solid ${R(C.err,0.22)}`,whiteSpace:'nowrap'}}>{label}</span>;
                            })}
                          </div>
                        ) : (()=>{
                          const strategyLabels={
                            'rebound':'Rebound',
                            'confirmed_breakout':'Confirmed Breakout',
                            'false_breakout_one_bar':'False Breakout',
                            'level_retest_forecast':'Level Retest',
                            'level_breakout_forecast':'Level Breakout',
                          };
                          const sourceLabels={
                            'ACTIVE REPLAY':'Live signal',
                            'PROJECTED':'Projected',
                          };
                          const stratLabel=strategyLabels[r.strategy]||(r.strategy||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())||null;
                          const srcLabel=sourceLabels[r.source]||r.source||null;
                          const checks=[];
                          if(rr>0) checks.push(`R:R ${rr.toFixed(2)} ≥ ${Number(fc.minRR).toFixed(1)}`);
                          if(r.entry_distance_atr!=null) checks.push(`${Number(r.entry_distance_atr).toFixed(2)} ATR dist`);
                          if(qty>0&&entry>0) checks.push(`${qty} sh @ $${entry.toFixed(2)}`);
                          if(rewardDollar!=null) checks.push(`+$${rewardDollar.toFixed(0)} target`);
                          return (
                            <div style={{display:'flex',flexDirection:'column',gap:5}}>
                              {/* strategy + source line */}
                              <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                                {stratLabel&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,color:C.cyan,background:R(C.cyan,0.1),border:`1px solid ${R(C.cyan,0.28)}`}}>
                                  <Icon n="strategy" size={11} color={C.cyan}/>{stratLabel}
                                </span>}
                                {srcLabel&&<span style={{padding:'2px 8px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:r.source==='ACTIVE REPLAY'?C.lime:C.onVar,background:r.source==='ACTIVE REPLAY'?R(C.lime,0.08):R(C.outline,0.08),border:`1px solid ${r.source==='ACTIVE REPLAY'?R(C.lime,0.22):R(C.outline,0.18)}`}}>{srcLabel}</span>}
                              </div>
                              {/* check pills */}
                              <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
                                <Icon n="check_circle" size={11} color={C.lime}/>
                                {checks.map((c,ci)=>(
                                  <span key={ci} style={{padding:'1px 7px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#9ecfb0',background:'rgba(100,180,120,0.08)',border:'1px solid rgba(100,180,120,0.18)',whiteSpace:'nowrap'}}>{c}</span>
                                ))}
                              </div>
                            </div>
                          );
                        })()}
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`}}>

                          <button onClick={()=>setConfirm({type:'close',row:r})}
                            style={{padding:'7px 16px',borderRadius:7,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onVar,background:'rgba(28,27,28,0.6)',border:`1px solid rgba(132,148,149,0.22)`}}>Close</button>
                        </div>
                      </td>
                    </tr>

                })}</tbody>
              </table>
            </div>

            {/* Expanded full table toggle */}
            <div onClick={()=>setFcExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,marginTop:16,padding:'13px 16px',borderRadius:10,cursor:'pointer',background:R(C.surfLowest,0.5),border:`1px solid ${R(C.outline,0.16)}`}}>
              <Icon n={fcExpanded?'expand_more':'chevron_right'} size={18} color={C.outline}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar}}>Full ledger table (all columns, sortable)</span>
            </div>
            {fcExpanded && (
              <div style={{overflowX:'auto',marginTop:12,border:`1px solid ${R(C.outline,0.14)}`,borderRadius:10}}>
                <table style={{width:'100%',borderCollapse:'collapse',minWidth:1180}}>
                  <thead><tr>{['Symbol','Source','Strategy','Side','Current','Entry','Dist %','Dist ATR','Stop','Target','R:R','Shares','Pos Value','Risk $','Pot Reward','Status'].map(c=>(
                    <th key={c} style={{padding:'11px 16px',textAlign:'left',fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',textTransform:'uppercase',color:C.outline,borderBottom:`1px solid ${R(C.outline,0.12)}`,whiteSpace:'nowrap'}}>{c}</th>
                  ))}</tr></thead>
                  <tbody>{rows.map((r,i)=>(
                    <tr key={i} onMouseEnter={e=>e.currentTarget.style.background=R('#fff',0.025)} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      {[
                        <span style={{color:C.onSurf,fontWeight:500}}>{r.symbol}</span>,
                        <Pill text={r.source||'—'} color={r.source==='ACTIVE REPLAY'?C.cyan:C.magenta}/>,
                        <span style={{fontFamily:"'Inter',sans-serif",color:C.onVar}}>{r.strategy}</span>,
                        <span style={{color:r.signal==='BUY'?C.lime:C.err}}>{r.signal}</span>,
                        r.current_price?`$${Number(r.current_price).toFixed(2)}`:'—',
                        `$${Number(r.entry||0).toFixed(2)}`,
                        r.entry_distance_pct!=null?`${(r.entry_distance_pct*100).toFixed(1)}%`:'—',
                        r.entry_distance_atr!=null?Number(r.entry_distance_atr).toFixed(2):'—',
                        `$${Number(r.stop||0).toFixed(2)}`,
                        `$${Number(r.target||0).toFixed(2)}`,
                        <span style={{color:Number(r.reward_risk||0)>=Number(fc.minRR)?C.lime:C.outline}}>{Number(r.reward_risk||0).toFixed(2)}</span>,
                        r.quantity>0?r.quantity:'—',
                        r.quantity>0?`$${Math.round(r.position_value||0).toLocaleString()}`:'—',
                        r.quantity>0?`$${Math.round(r.risk_amount||0).toLocaleString()}`:'—',
                        <span style={{color:C.lime}}>{r.quantity>0?`$${Math.round(r.potential_reward||0).toLocaleString()}`:'—'}</span>,

                  ))}</tbody>
                </table>

            )}
          </div>
        </GlassCard>

        {/* Selected symbol chart */}
        {selRow && (
          <div ref={forecastChartFullscreenRef} className="strategy-chart-fullscreen-shell">
          <GlassCard style={{overflow:'hidden'}}>
            <div style={{padding:'16px 20px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <Icon n="candlestick_chart" size={17} color={C.outline}/>

                <Pill text={`${selRow.signal} · ${selRow.source}`} color={C.cyan}/>

              <TfPills value={tf} onChange={setTf}/>
            </div>
            <div style={{padding:'12px 20px',borderBottom:`1px solid ${R(C.outline,0.1)}`,display:'flex',justifyContent:'space-between',alignItems:'center',gap:14,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:22,flexWrap:'wrap'}}>
                <Toggle on={showRaw} label="Raw levels" onChange={setShowRaw}/>
                <Toggle on={showTrade} label="Trade zones" onChange={setShowTrade}/>
                <Toggle on={showVol} label="Volume" onChange={setShowVol}/>

              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',color:C.outline,textTransform:'uppercase'}}>Target</span>
              <input type="number" min="0" step="0.01" value={fcSetupDraft.target}
                readOnly={Boolean(fcSetupDraft.rrLocked)}

                title={fcSetupDraft.rrLocked ? 'Target is calculated from Entry, Stop, and R:R. Edit/clear R:R to unlock target.' : 'Manual target value.'}
                style={{width:115,background:R(C.surfLowest,0.8),color:C.lime,border:`1px solid ${R(C.lime,0.32)}`,borderRadius:8,padding:'8px 11px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,outline:'none'}}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',color:C.outline,textTransform:'uppercase'}}>R:R</span>
              <input type="number" min="0" step="0.25" value={fcSetupDraft.rrLocked ? fcSetupDraft.rr : (fcSetup ? fcSetup.reward_risk.toFixed(2) : fcSetupDraft.rr)}
                onChange={e=>applyForecastRrChange(e.target.value)}
                title="When edited, target is recalculated from Entry, Stop, and R:R."
                style={{width:85,background:R(C.surfLowest,0.8),color:C.cyan,border:`1px solid ${R(fcSetupDraft.rrLocked?C.cyan:C.outline,fcSetupDraft.rrLocked?0.38:0.25)}`,borderRadius:8,padding:'8px 11px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,outline:'none'}}/>
              <button onClick={()=>{
                setFcSetupDraft({
                  key:selectedForecastKey,
                  entry:Number(selRow.entry||0)>0 ? Number(selRow.entry||0).toFixed(2) : '',
                  stop:Number(selRow.stop||0)>0 ? Number(selRow.stop||0).toFixed(2) : '',
                  target:Number(selRow.target||0)>0 ? Number(selRow.target||0).toFixed(2) : '',
                  rr:Number(selRow.reward_risk||0)>0 ? Number(selRow.reward_risk||0).toFixed(2) : '',
                  rrLocked:false,
                });
                setFcSetupQty({key:selectedForecastKey,value:String(Math.max(0,Math.floor(Number(selRow.quantity||0)||0)))});
              }}
                style={{padding:'8px 11px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onVar,background:R(C.outline,0.08),border:`1px solid ${R(C.outline,0.22)}`}}>
                Reset forecast
              </button>
              {fcSetup ? (
                <>
                  <Pill text={`RISK $${fcSetup.risk_amount.toFixed(2)}`} color={fcSetup.quantity>0?C.err:C.outline}/>
                  <Pill text={`PROFIT $${fcSetup.potential_reward.toFixed(2)}`} color={fcSetup.quantity>0?C.lime:C.outline}/>
                  <Pill text={`R:R ${fcSetup.reward_risk.toFixed(2)}`} color={fcSetup.reward_risk>=Number(fc.minRR)?C.lime:C.outline}/>
                  <button disabled={selRow.status!=='FORECAST TRADE' || !fcSetup.valid || fcSetup.quantity<=0}
                    onClick={()=>setConfirm({type:'place',row:fcSetup.row})}
                    style={{padding:'8px 15px',borderRadius:8,cursor:selRow.status==='FORECAST TRADE'&&fcSetup.valid&&fcSetup.quantity>0?'pointer':'not-allowed',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:selRow.status==='FORECAST TRADE'&&fcSetup.valid&&fcSetup.quantity>0?'#001416':C.outline,background:selRow.status==='FORECAST TRADE'&&fcSetup.valid&&fcSetup.quantity>0?C.cyan:R(C.outline,0.08),border:`1px solid ${selRow.status==='FORECAST TRADE'&&fcSetup.valid&&fcSetup.quantity>0?R(C.cyan,0.35):R(C.outline,0.14)}`,opacity:selRow.status==='FORECAST TRADE'&&fcSetup.valid&&fcSetup.quantity>0?1:0.6}}>
                    Place adjusted
                  </button>
                </>
              ) : (
                <span style={{fontFamily:"'Inter',sans-serif",fontSize:12,color:C.outline}}>Enter valid entry, stop, target, or R:R to redraw the setup.</span>
              )}
            </div>
            <div style={{padding:'18px 20px'}}>
              <CandleChart bars={visibleSelBars} levels={buildChartLevels(selPlan?.trade_levels, selPlan?.raw_levels, showTrade, showRaw)} lines={selLines}
                zones={[
                  ...(fcSetup ? [{p1:fcSetup.entry,p2:fcSetup.target,color:C.lime,opacity:0.07}] : []),
                  ...(fcSetup ? [{p1:fcSetup.entry,p2:fcSetup.stop,color:C.err,opacity:0.08}] : []),
                ]}
                strategyOverlay={strategyOverlay}
                gaussianOverlay={gaussianOverlay}
                showVol={showVol}
                height={600}
                fullscreenTargetRef={forecastChartFullscreenRef}
                fullscreenHeightOffset={300}
                stale={selBarsInfo.stale}
                lastDate={selBarsInfo.lastDate}/>
            </div>
          </GlassCard>
          </div>
        )}
      </>)}

      {/* ── Order Confirmation Modal ── */}
      {confirm && (
        <div onClick={()=>setConfirm(null)} style={{position:'fixed',inset:0,zIndex:70,background:'rgba(8,8,9,0.80)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:460,background:'rgba(20,19,20,0.98)',border:`1px solid ${R(C.outline,0.22)}`,borderRadius:14,boxShadow:'0 30px 80px rgba(0,0,0,0.7)',overflow:'hidden'}}>
            {/* header */}
            <div style={{padding:'18px 22px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',alignItems:'center',gap:12}}>
              <Icon n={confirm.type==='place'?'send':'close'} size={20} color={confirm.type==='place'?C.cyan:C.err}/>
              <span style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:17,fontWeight:600,color:C.onSurf}}>
                {confirm.type==='place'?'Confirm Place Order':'Confirm Close Position'}
              </span>
            </div>
            {/* body */}
            <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:10,background:R(C.magenta,0.06),border:`1px solid ${R(C.magenta,0.22)}`}}>
                <Icon n="shield_lock" size={18} color={C.magenta} style={{flexShrink:0}}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.magenta,lineHeight:1.5}}>Paper account · respects DRY_RUN · no real money at risk</span>
              </div>
              {confirm.type==='place' ? (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 18px'}}>
                  {[
                    ['Symbol', confirm.row.symbol],
                    ['Side', confirm.row.signal],
                    ['Entry', '$'+Number(confirm.row.entry||0).toFixed(2)],
                    ['Stop', '$'+Number(confirm.row.stop||0).toFixed(2)],
                    ['Target', '$'+Number(confirm.row.target||0).toFixed(2)],
                    ['Qty', confirm.row.quantity||'—'],
                    ['R:R', Number(confirm.row.reward_risk||0).toFixed(2)],
                    ['Strategy', confirm.row.strategy||'—'],
                  ].map(([k,v])=>(
                    <div key={k}>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginBottom:4}}>{k}</div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:C.onSurf,fontWeight:500}}>{v}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,color:C.onSurf,padding:'10px 0'}}>
                  Close all open positions for <span style={{color:C.err}}>{confirm.row.symbol}</span> via a paper market order.
                </div>
              )}
            </div>
            {/* footer */}
            <div style={{padding:'16px 22px',borderTop:`1px solid ${R(C.outline,0.14)}`,display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button onClick={()=>setConfirm(null)}
                style={{padding:'10px 20px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(C.outline,0.25)}`}}>
                Cancel
              </button>
              <button onClick={()=>confirm.type==='place'?doPlace(confirm.row):doClose(confirm.row.symbol)}
                style={{padding:'10px 22px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:600,
                  color:confirm.type==='place'?'#001416':C.onSurf,
                  background:confirm.type==='place'?C.cyan:C.err,
                  border:'none'}}>
                {confirm.type==='place'?'Place Order':'Close Position'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   TAB: REPORTS
═══════════════════════════════════════════════════════════════════════════ */
function TabCrypto({refreshKey=0}) {
  const cryptoChartFullscreenRef = useRef(null);
  const [data, setData] = useState(null);
  const [selected, setSelected] = useState('');
  const [tf, setTf] = useState('1D');
  const [range, setRange] = useState('6M');
  const [showRaw, setShowRaw] = useState(false);
  const [showTrade, setShowTrade] = useState(true);
  const [showVol, setShowVol] = useState(true);
  const [showStrategy, setShowStrategy] = useState(false);
  const [showStrategy2, setShowStrategy2] = useState(false);
  const [showGaussian, setShowGaussian] = useState(false);
  const [showGaussianSignals, setShowGaussianSignals] = useState(false);
  const [bars, setBars] = useState([]);
  const [barsInfo, setBarsInfo] = useState({stale:false,lastDate:null});
  const [plan, setPlan] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [cryptoAddOpen, setCryptoAddOpen] = useState(false);
  const [cryptoNewSymbol, setCryptoNewSymbol] = useState('');
  const [cryptoAddBusy, setCryptoAddBusy] = useState(false);
  const [cryptoAddFeedback, setCryptoAddFeedback] = useState(null);

  useEffect(()=>{ fetch(`${API}/crypto`).then(r=>r.json()).then(setData).catch(()=>setData({rows:[],metrics:{}})); },[refreshKey]);
  useEffect(()=>{
    const first = data?.rows?.find(r=>r.ready)?.symbol || data?.rows?.[0]?.symbol;
    if(first && !selected) setSelected(first);
  },[data, selected]);
  useEffect(()=>{
    if(!selected) return;
    const apitf = TF_API[tf] || 'daily';
    fetch(`${API}/crypto/bars/${selected}/${apitf}`)
      .then(r=>r.json())
      .then(d=>{setBars(d.bars||[]);setBarsInfo({stale:d.stale,lastDate:d.last_date});})
      .catch(()=>{setBars([]);setBarsInfo({stale:false,lastDate:null});});
    fetch(`${API}/crypto/${selected}`)
      .then(r=>r.ok?r.json():null)
      .then(d=>setPlan(d||null))
      .catch(()=>setPlan(null));
  },[selected, tf, refreshKey]);

  const runAnalyze = async() => {
    setAnalyzing(true);
    try {
      await fetch(`${API}/crypto/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
      const d = await fetch(`${API}/crypto`).then(r=>r.json());
      setData(d);
    } finally {
      setAnalyzing(false);
    }
  };

  const submitCryptoAdd = useCallback(async()=>{
    const symbol = cryptoNewSymbol.trim();
    if(!symbol) return;
    setCryptoAddBusy(true);
    setCryptoAddFeedback(null);
    try{
      const r = await fetch(`${API}/crypto/add`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol})
      });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.detail || d.message || 'Failed to add crypto symbol');
      setCryptoAddFeedback({ok:true,message:d.message,log:d.log});
      if(d.symbol) setSelected(d.symbol);
      setCryptoNewSymbol('');
      setCryptoAddOpen(false);
      const fresh = await fetch(`${API}/crypto`).then(x=>x.json());
      setData(fresh);
    }catch(e){
      setCryptoAddFeedback({ok:false,message:String(e.message||e)});
    }finally{
      setCryptoAddBusy(false);
    }
  },[cryptoNewSymbol]);

  const strategyOverlay = useMemo(
    ()=>{
      const count = RANGE_COUNTS[range]||9999;
      const overlays = [
        showStrategy ? sliceOverlayPoints(buildBmsbStrategyOverlay(bars), count) : null,
        showStrategy2 ? sliceOverlayPoints(buildBmsbStrategy2Overlay(bars), count) : null,
      ].filter(Boolean);
      return overlays.length ? overlays : null;
    },
    [showStrategy, showStrategy2, bars, range]
  );
  const gaussianOverlay = useMemo(()=>{
    if(!showGaussian && !showGaussianSignals) return null;
    const full = buildGaussianChannelOverlay(bars);
    return full ? {...full, showChannel:showGaussian, showSignals:showGaussianSignals, points: full.points.slice(-(RANGE_COUNTS[range]||9999))} : null;
  },[showGaussian, showGaussianSignals, bars, range]);

  if(!data) return <Spinner/>;
  const rows = data.rows || [];
  const m = data.metrics || {};
  const tv = data.tradingview || {};
  const tvPositions = tv.positions || [];
  const tvExecutions = tv.executions || [];
  const selectedRow = rows.find(r=>r.symbol===selected) || rows[0] || {};
  const visibleBars = bars.slice(-(RANGE_COUNTS[range]||9999));
  const chartLevels = buildChartLevels(plan?.trade_levels, plan?.raw_levels, showTrade, showRaw);
  const qty = v => v!=null && Number.isFinite(Number(v)) ? Number(v).toFixed(8).replace(/0+$/,'').replace(/\.$/,'') : 'â€”';

function OrdersPnlChart({rows=[]}) {
  const [range,setRange]=useState('1M');
  const [customFrom,setCustomFrom]=useState('');
  const [customTo,setCustomTo]=useState('');
  const [hoverIdx,setHoverIdx]=useState(null);
  const money = v => {
    const n=Number(v);
    if(!Number.isFinite(n)) return '$0.00';
    return `${n<0?'-':''}$${Math.abs(n).toFixed(2)}`;
  };
  const dateKey = value => {
    if(!value) return null;
    const d=new Date(String(value).replace(' ','T'));
    if(!Number.isFinite(d.getTime())) return null;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const fmtDate = key => {
    if(!key) return '';
    const [y,m,d]=String(key).split('-');
    return `${m}/${d}/${String(y).slice(2)}`;
  };
  const addMonths = (d, months) => {
    const copy=new Date(d);
    copy.setMonth(copy.getMonth()+months);
    return copy;
  };
  const addDays = (d, days) => {
    const copy=new Date(d);
    copy.setDate(copy.getDate()+days);
    return copy;
  };
  const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const endOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999);
  const rangeBounds = useMemo(()=>{
    const now=endOfDay(new Date());
    if(range==='CUSTOM'){
      return {
        start: customFrom ? startOfDay(new Date(`${customFrom}T00:00:00`)) : null,
        end: customTo ? endOfDay(new Date(`${customTo}T00:00:00`)) : null,
      };
    }
    if(range==='1W') return {start:startOfDay(addDays(now,-7)),end:now};
    if(range==='1M') return {start:startOfDay(addMonths(now,-1)),end:now};
    if(range==='YTD') return {start:new Date(now.getFullYear(),0,1),end:now};
    if(range==='1Y') return {start:startOfDay(addMonths(now,-12)),end:now};
    return {start:null,end:now};
  },[range,customFrom,customTo]);

  const points = useMemo(()=>{
    const grouped=new Map();
    rows.forEach(r=>{
      const pnl=Number(r.pnl);
      if(!Number.isFinite(pnl)) return;
      const key=dateKey(r.closed_at || r.opened_at || r.created_at);
      if(!key) return;
      const dt=startOfDay(new Date(`${key}T00:00:00`));
      if(rangeBounds.start && dt < rangeBounds.start) return;
      if(rangeBounds.end && dt > rangeBounds.end) return;
      grouped.set(key,(grouped.get(key)||0)+pnl);
    });
    return [...grouped.entries()]
      .sort(([a],[b])=>a.localeCompare(b))
      .map(([date,pnl])=>({date,pnl}));
  },[rows,rangeBounds]);

  const total = points.reduce((s,p)=>s+p.pnl,0);
  const greenDays = points.filter(p=>p.pnl>0).length;
  const redDays = points.filter(p=>p.pnl<0).length;
  const W=980,H=270,padL=64,padR=32,padT=24,padB=42;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const vals = points.map(p=>p.pnl);
  const rawMin=Math.min(0,...vals), rawMax=Math.max(0,...vals);
  const span=Math.max(1,rawMax-rawMin);
  const minY=rawMin-span*0.12, maxY=rawMax+span*0.12;
  const xFor = i => points.length<=1 ? padL+plotW/2 : padL+(i/(points.length-1))*plotW;
  const yFor = v => padT+((maxY-v)/(maxY-minY))*plotH;
  const zeroY=yFor(0);
  const hoverPoint = hoverIdx!=null ? points[hoverIdx] : null;
  const yTicks = [0,0.25,0.5,0.75,1].map(t=>maxY-(maxY-minY)*t);
  const xTickIdxs = points.length
    ? [...new Set([0,Math.floor((points.length-1)*0.25),Math.floor((points.length-1)*0.5),Math.floor((points.length-1)*0.75),points.length-1])]
    : [];

  return (
    <GlassCard style={{overflow:'hidden'}}>
      <div style={{padding:'16px 18px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Icon n="show_chart" size={18} color={C.cyan}/>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>Profit & Loss Curve</span>
          <span style={{padding:'3px 9px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.cyan,background:R(C.cyan,0.1),border:`1px solid ${R(C.cyan,0.28)}`}}>{points.length} trading days</span>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {['1W','1M','YTD','1Y','ALL'].map(rg=>{
            const active=range===rg;
            return <button key={rg} onClick={()=>setRange(rg)}
              style={{padding:'7px 11px',borderRadius:8,cursor:'pointer',border:`1px solid ${R(active?C.cyan:C.outline,active?0.45:0.18)}`,background:active?R(C.cyan,0.12):R(C.surf,0.5),color:active?C.cyan:C.onVar,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800}}>
              {rg}
            </button>;
          })}
          <button onClick={()=>setRange('CUSTOM')}
            style={{padding:'7px 11px',borderRadius:8,cursor:'pointer',border:`1px solid ${R(range==='CUSTOM'?C.cyan:C.outline,range==='CUSTOM'?0.45:0.18)}`,background:range==='CUSTOM'?R(C.cyan,0.12):R(C.surf,0.5),color:range==='CUSTOM'?C.cyan:C.onVar,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800}}>
            CUSTOM
          </button>
          {range==='CUSTOM' && (
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 9px',borderRadius:8,background:R(C.surfLowest,0.85),border:`1px solid ${R(C.outline,0.22)}`}}>
              <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)}
                style={{background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:11,colorScheme:'dark'}}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline}}>to</span>
              <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)}
                style={{background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:11,colorScheme:'dark'}}/>
            </div>
          )}
        </div>
      </div>
      <div style={{padding:'14px 18px 18px'}}>
        <div style={{display:'flex',gap:18,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
          <Pill text={`TOTAL ${money(total)}`} color={total>=0?C.lime:C.err}/>
          <Pill text={`${greenDays} green days`} color={C.lime}/>
          <Pill text={`${redDays} red days`} color={C.err}/>
          {hoverPoint && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:hoverPoint.pnl>=0?C.lime:C.err}}>
            {fmtDate(hoverPoint.date)} · {money(hoverPoint.pnl)}
          </span>}
        </div>
        {points.length===0 ? (
          <div style={{height:250,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline,border:`1px dashed ${R(C.outline,0.22)}`,borderRadius:10}}>
            No realized P&L rows in this range.
          </div>
        ) : (
          <div style={{position:'relative',height:280}}>
            <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" width="100%" height="100%"
              onMouseLeave={()=>setHoverIdx(null)}
              onMouseMove={e=>{
                const rect=e.currentTarget.getBoundingClientRect();
                const sx=(e.clientX-rect.left)/rect.width*W;
                if(points.length<=1){ setHoverIdx(0); return; }
                const idx=Math.max(0,Math.min(points.length-1,Math.round((sx-padL)/plotW*(points.length-1))));
                setHoverIdx(idx);
              }}>
              <rect x="0" y="0" width={W} height={H} fill={R(C.surfLowest,0.35)} rx="10"/>
              {yTicks.map((v,i)=>(
                <g key={i}>
                  <line x1={padL} x2={W-padR} y1={yFor(v)} y2={yFor(v)} stroke={R(C.outline,0.08)} strokeWidth="1"/>
                  <text x={padL-10} y={yFor(v)+4} textAnchor="end" fill={R(C.outline,0.65)} fontSize="10" fontFamily="JetBrains Mono,monospace">{money(v)}</text>
                </g>
              ))}
              <line x1={padL} x2={W-padR} y1={zeroY} y2={zeroY} stroke={R(C.onVar,0.3)} strokeWidth="1.2" strokeDasharray="5 5"/>
              {points.slice(1).map((p,i)=>{
                const prev=points[i];
                const col=p.pnl>=0?C.lime:C.err;
                return <line key={p.date} x1={xFor(i)} y1={yFor(prev.pnl)} x2={xFor(i+1)} y2={yFor(p.pnl)}
                  stroke={col} strokeWidth="2.4" strokeLinecap="round"/>;
              })}
              {points.length===1 && <circle cx={xFor(0)} cy={yFor(points[0].pnl)} r="4.5" fill={points[0].pnl>=0?C.lime:C.err}/>}
              {points.map((p,i)=>(
                <circle key={`${p.date}-dot`} cx={xFor(i)} cy={yFor(p.pnl)} r={hoverIdx===i?4.5:2.8}
                  fill={p.pnl>=0?C.lime:C.err} stroke={R(C.bg,0.9)} strokeWidth="1"/>
              ))}
              {xTickIdxs.map(i=>(
                <text key={i} x={xFor(i)} y={H-14} textAnchor="middle" fill={R(C.outline,0.68)} fontSize="10" fontFamily="JetBrains Mono,monospace">{fmtDate(points[i].date)}</text>
              ))}
              {hoverPoint && (
                <g>
                  <line x1={xFor(hoverIdx)} x2={xFor(hoverIdx)} y1={padT} y2={H-padB} stroke={R(C.cyan,0.22)} strokeDasharray="4 4"/>
                  <circle cx={xFor(hoverIdx)} cy={yFor(hoverPoint.pnl)} r="6" fill={R(hoverPoint.pnl>=0?C.lime:C.err,0.2)} stroke={hoverPoint.pnl>=0?C.lime:C.err}/>
                </g>
              )}
            </svg>
          </div>
        )}
      </div>
    </GlassCard>
  );
}

function TabMarketScreener({refreshKey=0}) {
  const [data,setData]=useState(null);
  const [tf,setTf]=useState('1D');
  const [side,setSide]=useState('ALL');
  const [strategies,setStrategies]=useState(['LP1','LP2','PRB1','PRB2']);
  const [minScore,setMinScore]=useState(0);
  const [rr,setRr]=useState(2);
  const [riskPct,setRiskPct]=useState(0.5);
  const [busy,setBusy]=useState(false);
  const [symbolSearch,setSymbolSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('ALL');
  const money = v => v!=null && Number.isFinite(Number(v)) ? `$${Number(v).toFixed(Math.abs(Number(v))>=10?2:4)}` : '—';
  const num = (v,d=2) => v!=null && Number.isFinite(Number(v)) ? Number(v).toFixed(d) : '—';
  const pct = v => v!=null && Number.isFinite(Number(v)) ? `${Number(v).toFixed(2)}%` : '—';

  const loadScreener = useCallback(()=>{
    setBusy(true);
    const query = new URLSearchParams({
      timeframe:tf,
      strategies:strategies.join(','),
      side,
      min_score:String(minScore),
      rr:String(rr),
      risk_pct:String(riskPct),
    });
    fetch(`${API}/market-screener?${query.toString()}`,{cache:'no-store'})
      .then(r=>r.json())
      .then(setData)
      .catch(()=>setData({signals:[],rejected:[],near_misses:[],reason_counts:{},error:'Failed to load screener'}))
      .finally(()=>setBusy(false));
  },[tf,side,strategies.join(','),minScore,rr,riskPct]);

  useEffect(()=>{ loadScreener(); },[refreshKey, loadScreener]);
  const toggleStrategy = strategy => {
    setStrategies(current=>{
      const next = current.includes(strategy) ? current.filter(item=>item!==strategy) : [...current, strategy];
      return next.length ? next : [strategy];
    });
  };
  if(!data) return <Spinner/>;

  const signals = data.signals || [];
  const rejected = data.rejected || [];
  const nearMisses = data.near_misses || [];
  const reasonCounts = Object.entries(data.reason_counts || {});
  const symbolNeedle = symbolSearch.trim().toUpperCase();
  const filteredSignals = signals.filter(row=>{
    if(symbolNeedle && !String(row.ticker||'').includes(symbolNeedle)) return false;
    if(statusFilter!=='ALL' && row.status!==statusFilter) return false;
    return true;
  });
  const readyCount = signals.filter(row=>row.status==='READY').length;
  const avgScore = signals.length ? signals.reduce((sum,row)=>sum+Number(row.score||0),0)/signals.length : null;
  const controlsShell = {display:'flex',alignItems:'center',gap:8,padding:'9px 11px',borderRadius:8,background:R(C.surfLowest,0.78),border:`1px solid ${R(C.outline,0.22)}`};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:22}}>
      <MetricGrid items={[
        {label:'Universe',icon:'radar',value:data.universe_size??0,sub:`${data.timeframe||tf} scan`,valueColor:C.cyan},
        {label:'Signals',icon:'bolt',value:data.signals_found??0,sub:'LP / PRB matches',valueColor:(data.signals_found||0)>0?C.lime:C.outline},
        {label:'Ready',icon:'task_alt',value:readyCount,sub:'position size valid',valueColor:C.lime},
        {label:'Rejected',icon:'filter_alt',value:rejected.length,sub:'quality / data filters',valueColor:C.err},
        {label:'Near Misses',icon:'adjust',value:nearMisses.length,sub:'levels found, pattern incomplete',valueColor:C.cyan},
        {label:'Avg Score',icon:'analytics',value:avgScore!=null?num(avgScore,2):'—',sub:'visible signals',valueColor:C.cyan},
      ]}/>

      <GlassCard style={{padding:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            {['1D','4H','1H'].map(item=><button key={item} onClick={()=>setTf(item)}
              style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:800,border:`1px solid ${R(tf===item?C.cyan:C.outline,tf===item?0.44:0.2)}`,background:tf===item?R(C.cyan,0.13):R(C.surfLowest,0.55),color:tf===item?C.cyan:C.onVar}}>
              {item}
            </button>)}
            {['LP1','LP2','PRB1','PRB2'].map(item=>{
              const active=strategies.includes(item);
              return <button key={item} onClick={()=>toggleStrategy(item)}
                style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:800,border:`1px solid ${R(active?C.lime:C.outline,active?0.42:0.18)}`,background:active?R(C.lime,0.11):R(C.surfLowest,0.45),color:active?C.lime:C.onVar}}>
                {item}
              </button>;
            })}
            <select value={side} onChange={e=>setSide(e.target.value)} style={{...controlsShell,color:C.onSurf,outline:0}}>
              {['ALL','LONG','SHORT'].map(item=><option key={item}>{item}</option>)}
            </select>
          </div>
          <button onClick={loadScreener} disabled={busy}
            style={{padding:'9px 14px',borderRadius:8,cursor:busy?'wait':'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:900,border:`1px solid ${R(C.cyan,0.35)}`,background:R(C.cyan,0.11),color:C.cyan,display:'flex',alignItems:'center',gap:7}}>
            <Icon n="refresh" size={15} color="inherit" style={{animation:busy?'spin .8s linear infinite':undefined}}/>
            {busy?'SCANNING':'SCAN'}
          </button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginTop:14}}>
          <label style={controlsShell}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,textTransform:'uppercase'}}>Min score</span>
            <input type="number" min="0" max="1" step="0.05" value={minScore} onChange={e=>setMinScore(Number(e.target.value)||0)}
              style={{width:70,marginLeft:'auto',background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}/>
          </label>
          <label style={controlsShell}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,textTransform:'uppercase'}}>RR</span>
            <input type="number" min="1" max="3" step="0.25" value={rr} onChange={e=>setRr(Number(e.target.value)||2)}
              style={{width:70,marginLeft:'auto',background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}/>
          </label>
          <label style={controlsShell}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,textTransform:'uppercase'}}>Risk %</span>
            <input type="number" min="0.01" max="5" step="0.05" value={riskPct} onChange={e=>setRiskPct(Number(e.target.value)||0.5)}
              style={{width:70,marginLeft:'auto',background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}/>
          </label>
          <label style={controlsShell}>
            <Icon n="search" size={15} color={symbolNeedle?C.cyan:C.outline}/>
            <input value={symbolSearch} onChange={e=>setSymbolSearch(e.target.value.toUpperCase())} placeholder="Symbol"
              style={{flex:1,minWidth:0,background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.06em',textTransform:'uppercase'}}/>
          </label>
        </div>
      </GlassCard>

      <GlassCard style={{overflow:'hidden'}}>
        <div style={{padding:'16px 18px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <PanelHeader icon="radar" title="Screener Signals" badge={`${filteredSignals.length} shown`}/>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {['ALL','READY','capital_insufficient'].map(item=><button key={item} onClick={()=>setStatusFilter(item)}
              style={{padding:'8px 10px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800,border:`1px solid ${R(statusFilter===item?C.cyan:C.outline,statusFilter===item?0.44:0.18)}`,background:statusFilter===item?R(C.cyan,0.12):R(C.surf,0.5),color:statusFilter===item?C.cyan:C.onVar}}>
              {item}
            </button>)}
          </div>
        </div>
        <Table
          cols={['Ticker','Strategy','Side','Status','Level','Entry','Stop','TP','RR','ATR','Score','Size','Filters','Reasoning']}
          rows={filteredSignals.map(row=>[
            <span style={{color:C.onSurf,fontWeight:900}}>{row.ticker}</span>,
            <Pill text={row.strategy} color={row.strategy?.startsWith('LP')?C.cyan:C.lime}/>,
            <Pill text={row.side} color={row.side==='SHORT'?C.err:C.lime}/>,
            <Pill text={row.status} color={row.status==='READY'?C.lime:C.err}/>,
            `${row.level_type} ${money(row.level_price)}`,
            money(row.entry_price),
            money(row.stop_price),
            money(row.take_profit_price),
            num(row.rr,2),
            num(row.atr_clean_14,2),
            <span style={{color:Number(row.score)>=0.7?C.lime:Number(row.score)>=0.45?C.cyan:C.outline,fontWeight:900}}>{num(row.score,2)}</span>,
            row.position_size_shares,
            <span style={{color:row.volume_filter_pass&&row.spread_filter_pass&&row.earnings_filter_pass?C.lime:C.err}}>
              {row.volume_filter_pass?'VOL':'vol'} / {row.spread_filter_pass?'SPR':'spr'} / {row.earnings_filter_pass?'EVT':'evt'}
            </span>,
            <span style={{fontFamily:"'Inter',sans-serif",whiteSpace:'normal',lineHeight:1.35,color:C.onVar}}>{row.reasoning}</span>,
          ])}
        />
        {!filteredSignals.length && (
          <div style={{padding:'24px 20px',display:'flex',alignItems:'center',gap:10,color:C.outline,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
            <Icon n="filter_alt_off" size={18} color={C.outline}/>
            No signals matched the current scan. Check near misses and rejection reasons below.
          </div>
        )}
      </GlassCard>

      <div style={{display:'grid',gridTemplateColumns:'minmax(280px,0.75fr) minmax(0,1.25fr)',gap:16,alignItems:'start'}}>
        <GlassCard style={{overflow:'hidden'}}>
          <PanelHeader icon="filter_list" title="Rejected Reasons" badge={`${rejected.length} rejected`}/>
          <Table
            cols={['Reason','Count']}
            rows={reasonCounts.map(([reason,count])=>[
              <span style={{color:C.err,fontWeight:800}}>{reason}</span>,
              count,
            ])}
          />
        </GlassCard>
        <GlassCard style={{overflow:'hidden'}}>
          <PanelHeader icon="adjust" title="Near Misses" badge={`${nearMisses.length} tracked`}/>
          <Table
            cols={['Ticker','Reason','Nearest Level','Distance ATR','Levels']}
            rows={nearMisses.slice(0,18).map(row=>[
              <span style={{color:C.onSurf,fontWeight:900}}>{row.ticker}</span>,
              row.reason,
              `${row.level_type || 'level'} ${money(row.nearest_level)}`,
              num(row.distance_atr,3),
              row.levels_found,
            ])}
