/* TAB: WATCHLIST */
function TabWatchlist({refreshKey=0}) {
  const [data, setData] = useState(null);
  const [query, setQuery] = useState('');
  const [status, setStatus] = useState('ALL');
  const [sortKey, setSortKey] = useState('symbol');
  const [sortDir, setSortDir] = useState('asc');
  const [addOpen, setAddOpen] = useState(false);
  const [newSymbol, setNewSymbol] = useState('');
  const [addBusy, setAddBusy] = useState(false);
  const [addFeedback, setAddFeedback] = useState(null);
  const [removeConfirm, setRemoveConfirm] = useState(null);
  const [removeBusy, setRemoveBusy] = useState(false);

  const loadWatchlist = useCallback(()=>{
    fetch(`${API}/watchlist`)
      .then(r=>r.json())
      .then(setData)
      .catch(()=>setData({rows:[],metrics:{}}));
  },[]);

  useEffect(()=>{
    loadWatchlist();
  },[refreshKey, loadWatchlist]);

  const submitSymbol = useCallback(async()=>{
    const symbol = newSymbol.trim().toUpperCase();
    if(!symbol) return;
    setAddBusy(true);
    setAddFeedback(null);
    try {
      const r = await fetch(`${API}/watchlist/add`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol}),
      });
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.detail || d.message || 'Failed to submit symbol');
      setAddFeedback({ok:true, message:d.message, log:d.log});
      setNewSymbol('');
      setAddOpen(false);
      loadWatchlist();
    } catch(e) {
      setAddFeedback({ok:false, message:String(e.message||e)});
    } finally {
      setAddBusy(false);
    }
  },[newSymbol, loadWatchlist]);

  const submitRemove = useCallback(async()=>{
    const symbol = String(removeConfirm?.symbol || '').trim().toUpperCase();
    if(!symbol) return;
    setRemoveBusy(true);
    setAddFeedback(null);
    try {
      const r = await fetch(`${API}/watchlist/remove`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol}),
      });
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.detail || d.message || 'Failed to remove symbol');
      setAddFeedback({ok:true, message:d.message});
      setRemoveConfirm(null);
      loadWatchlist();
    } catch(e) {
      setAddFeedback({ok:false, message:String(e.message||e)});
    } finally {
      setRemoveBusy(false);
    }
  },[removeConfirm, loadWatchlist]);

  const rows = useMemo(()=>{
    let out = [...(data?.rows||[])];
    const q = query.trim().toUpperCase();
    if(q) out = out.filter(r=>String(r.symbol||'').includes(q));
    if(status !== 'ALL') out = out.filter(r=>String(r.status||'') === status);
    out.sort((a,b)=>{
      const av = a?.[sortKey], bv = b?.[sortKey];
      const an = Number(av), bn = Number(bv);
      let cmp;
      if(Number.isFinite(an) && Number.isFinite(bn)) cmp = an - bn;
      else cmp = String(av ?? '').localeCompare(String(bv ?? ''));
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return out;
  },[data, query, status, sortKey, sortDir]);

  const m = data?.metrics || {};
  const money = v => v!=null && Number.isFinite(Number(v)) ? `$${Number(v).toFixed(Number(v)>=10?2:4)}` : '—';
  const fmt = (v, d=2) => v!=null && Number.isFinite(Number(v)) ? Number(v).toFixed(d) : '—';
  const vol = v => v!=null && Number.isFinite(Number(v)) ? Number(v).toLocaleString('en-US') : '—';
  const changeColor = v => Number(v)>0 ? C.lime : Number(v)<0 ? C.err : C.outline;
  const changeText = v => {
    if(v==null || !Number.isFinite(Number(v))) return '—';
    const n = Number(v);
    return `${n>0?'+':''}${n.toFixed(2)}`;
  };
  const pctText = v => {
    if(v==null || !Number.isFinite(Number(v))) return '—';
    const n = Number(v);
    return `${n>0?'+':''}${n.toFixed(2)}%`;
  };
  const setSort = key => {
    if(sortKey === key) setSortDir(d=>d==='asc'?'desc':'asc');
    else { setSortKey(key); setSortDir(key==='symbol'?'asc':'desc'); }
  };
  const sortable = (label, key) => (
    <button onClick={()=>setSort(key)} style={{background:'transparent',border:0,padding:0,cursor:'pointer',color:sortKey===key?C.cyan:C.outline,fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',textTransform:'uppercase'}}>
      {label}{sortKey===key ? (sortDir==='asc'?' ↑':' ↓') : ''}
    </button>
  );

  if(!data) return <Spinner/>;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <MetricGrid items={[
        {label:'Symbols', icon:'format_list_bulleted', value:m.symbols??0, sub:'current stock watchlist'},
        {label:'Trade-Ready', icon:'verified', value:m.ready??0, valueColor:C.lime, sub:'levels + clear news'},
        {label:'Pending', icon:'pending_actions', value:m.pending??0, valueColor:C.cyan, sub:'onboarding / not scanned yet'},
        {label:'Gainers', icon:'trending_up', value:m.gainers??0, valueColor:C.lime, sub:'positive daily change'},
        {label:'Losers', icon:'trending_down', value:m.losers??0, valueColor:C.err, sub:'negative daily change'},
      ]}/>

      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="visibility" title="Stock Watchlist" badge={`${rows.length} shown`}/>
        <div style={{padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:14,flexWrap:'wrap',borderBottom:`1px solid ${R(C.outline,0.12)}`}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',borderRadius:9,background:R(C.surfLowest,0.72),border:`1px solid ${R(C.outline,0.2)}`,minWidth:260}}>
            <Icon n="search" size={17} color={C.outline}/>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Find ticker"
              style={{flex:1,minWidth:0,background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:13,letterSpacing:'0.04em',textTransform:'uppercase'}}/>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={()=>{setAddOpen(v=>!v);setAddFeedback(null);}}
              style={{padding:'8px 13px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,border:`1px solid ${R(C.lime,0.35)}`,background:R(C.lime,0.10),color:C.lime,display:'inline-flex',alignItems:'center',gap:6}}>
              <Icon n="add" size={15} color={C.lime}/> Add
            </button>
            {['ALL','READY','PENDING','BLOCKED','NO LEVELS'].map(s=>{
              const a = s===status;
              return <button key={s} onClick={()=>setStatus(s)}
                style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,border:`1px solid ${a?R(C.cyan,0.4):R(C.outline,0.18)}`,background:a?R(C.cyan,0.14):R(C.surfLowest,0.45),color:a?C.cyan:C.onVar}}>
                {s}
              </button>;
            })}
          </div>
        </div>
        {(addOpen || addFeedback) && (
          <div style={{padding:'14px 18px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',borderBottom:`1px solid ${R(C.outline,0.10)}`,background:R(C.surfLowest,0.28)}}>
            {addOpen && (
              <>
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',borderRadius:9,background:R('#000',0.55),border:`1px solid ${R(C.cyan,0.25)}`,minWidth:220}}>
                  <Icon n="candlestick_chart" size={17} color={C.cyan}/>
                  <input value={newSymbol} onChange={e=>setNewSymbol(e.target.value.toUpperCase())} onKeyDown={e=>{if(e.key==='Enter') submitSymbol();}} placeholder="NVDA"
                    style={{flex:1,minWidth:0,background:'transparent',border:0,outline:0,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:14,letterSpacing:'0.06em',textTransform:'uppercase'}}/>
                </div>
                <button onClick={submitSymbol} disabled={addBusy || !newSymbol.trim()}
                  style={{padding:'10px 18px',borderRadius:9,cursor:addBusy?'wait':'pointer',fontFamily:"'Inter',sans-serif",fontSize:13,fontWeight:800,border:`1px solid ${R(C.cyan,0.4)}`,background:addBusy?R(C.outline,0.10):R(C.cyan,0.14),color:addBusy?C.outline:C.cyan}}>
                  {addBusy?'Submitting…':'Submit'}
                </button>
              </>
            )}
            {addFeedback && (
              <div style={{display:'flex',alignItems:'center',gap:8,fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:addFeedback.ok?C.lime:C.err}}>
                <Icon n={addFeedback.ok?'task_alt':'error'} size={16} color={addFeedback.ok?C.lime:C.err}/>
                <span>{addFeedback.message}</span>
              </div>
            )}
          </div>
        )}
        <Table
          cols={[
            sortable('Symbol','symbol'),
            'Status',
            sortable('Last','last_price'),
            sortable('Change','change'),
            sortable('Change %','change_pct'),
            'Open',
            'Day Range',
            sortable('Volume','volume'),
            'ATR',
            'Levels',
            'News',
            'Last Bar',
            'Remove',
          ]}
          rows={rows.map(r=>{
            const chColor = changeColor(r.change);
            return [
              <span style={{display:'inline-flex',alignItems:'center',gap:8,color:C.onSurf,fontWeight:800}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:r.status==='READY'?C.lime:r.status==='BLOCKED'?C.err:r.status==='PENDING'?C.cyan:C.outline,display:'inline-block'}}/>
                {r.symbol}
              </span>,
              <Pill text={r.status||'—'} color={r.status==='READY'?C.lime:r.status==='BLOCKED'?C.err:r.status==='PENDING'?C.cyan:C.outline}/>,
              <span style={{color:C.onSurf,fontWeight:700}}>{money(r.last_price)}</span>,
              <span style={{color:chColor,fontWeight:800}}>{changeText(r.change)}</span>,
              <span style={{color:chColor,fontWeight:800}}>{pctText(r.change_pct)}</span>,
              money(r.day_open),
              <span style={{color:C.onVar}}>{money(r.day_low)} / {money(r.day_high)}</span>,
              vol(r.volume),
              fmt(r.daily_atr,2),
              <span style={{color:Number(r.trade_levels)>0?C.cyan:C.outline}}>{r.trade_levels ?? 0}</span>,
              <Pill text={r.news||'—'} color={r.news==='CLEAR'?C.lime:C.err}/>,
              <span style={{color:C.outline}}>{r.last_bar ? String(r.last_bar).slice(0,16).replace('T',' ') : '—'}</span>,
              <button onClick={()=>setRemoveConfirm({symbol:r.symbol})}
                style={{padding:'6px 10px',borderRadius:7,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:800,color:C.err,background:R(C.err,0.08),border:`1px solid ${R(C.err,0.28)}`}}>
                Remove
              </button>,
            ];
          })}
        />
        {!rows.length && (
          <div style={{padding:'24px 20px',display:'flex',alignItems:'center',gap:10,color:C.outline,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
            <Icon n="search_off" size={18} color={C.outline}/>
            No watchlist symbols match the current filters.
          </div>
        )}
      </GlassCard>
      {removeConfirm && (
        <div onClick={()=>!removeBusy && setRemoveConfirm(null)} style={{position:'fixed',inset:0,zIndex:80,background:'rgba(8,8,9,0.78)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:430,background:'rgba(20,19,20,0.98)',border:`1px solid ${R(C.outline,0.22)}`,borderRadius:14,boxShadow:'0 30px 80px rgba(0,0,0,0.7)',overflow:'hidden'}}>
            <div style={{padding:'18px 22px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',alignItems:'center',gap:12}}>
              <Icon n="delete" size={20} color={C.err}/>
              <span style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:17,fontWeight:700,color:C.onSurf}}>Remove Symbol</span>
            </div>
            <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderRadius:10,background:R(C.err,0.07),border:`1px solid ${R(C.err,0.22)}`}}>
                <Icon n="warning" size={18} color={C.err}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.err,lineHeight:1.45}}>
                  Are you sure you want to remove {removeConfirm.symbol}?
                </span>
              </div>
              <span style={{fontFamily:"'Inter',sans-serif",fontSize:13,color:C.outline,lineHeight:1.45}}>
                This removes the symbol from the bot stock universe and active dashboard watchlist. Saved candle files are kept so the symbol can be added again later.
              </span>
            </div>
            <div style={{padding:'16px 22px',borderTop:`1px solid ${R(C.outline,0.14)}`,display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button disabled={removeBusy} onClick={()=>setRemoveConfirm(null)}
                style={{padding:'9px 14px',borderRadius:8,cursor:removeBusy?'wait':'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:800,color:C.onVar,background:R(C.outline,0.08),border:`1px solid ${R(C.outline,0.22)}`}}>
                Cancel
              </button>
              <button disabled={removeBusy} onClick={submitRemove}
                style={{padding:'9px 14px',borderRadius:8,cursor:removeBusy?'wait':'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:900,color:C.err,background:R(C.err,0.12),border:`1px solid ${R(C.err,0.36)}`}}>
                {removeBusy ? 'Removing...' : 'Submit'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TabPreOpen({refreshKey=0}) {
  const [ticker, setTicker] = useState('AAPL');
  const [status, setStatus] = useState('All');
  const [minLevels, setMinLevels] = useState(0);
  const [allRows, setAllRows] = useState([]);
  const [plan, setPlan] = useState(null);
  const [bars, setBars] = useState([]);
  const [barsInfo, setBarsInfo] = useState({stale:false,lastDate:null});
  const [tf, setTf] = useState('1H');
  const [allLevelsOpen, setAllLevelsOpen] = useState(false);
  const [showVol, setShowVol] = useState(true);
  const [showRaw, setShowRaw] = useState(false);
  const [showTrade, setShowTrade] = useState(true);
  const [showGaussian, setShowGaussian] = useState(false);
  const [showGaussianSignals, setShowGaussianSignals] = useState(false);

  useEffect(()=>{ fetch(`${API}/preopen`).then(r=>r.json()).then(d=>setAllRows(d.rows||[])); },[refreshKey]);

  const filtered = useMemo(()=>{
    let rows = allRows;
    if(ticker.trim()) rows=rows.filter(r=>r.symbol.includes(ticker.trim().toUpperCase()));
    if(status!=='All') rows=rows.filter(r=>r.status===status.toUpperCase().replace(' ','_'));
    rows=rows.filter(r=>(r.trade_levels||0)>=minLevels);
    return rows;
  },[allRows, ticker, status, minLevels]);

  const selected = filtered[0]?.symbol || null;

  useEffect(()=>{
    if(!selected) return;
    const apitf = TF_API[tf]||'daily';
    fetch(`${API}/preopen/${selected}`).then(r=>r.json()).then(setPlan).catch(()=>setPlan(null));
    fetch(`${API}/bars/${selected}/${apitf}`).then(r=>r.json()).then(d=>{setBars(d.bars||[]);setBarsInfo({stale:d.stale,lastDate:d.last_date});});
  },[selected, tf, refreshKey]);

  const fmtN = v => v!=null ? Number(v).toFixed(2) : '—';

  const chartLevels = useMemo(()=>
    buildChartLevels(plan?.trade_levels, plan?.raw_levels, showTrade, showRaw),
  [plan, showTrade, showRaw]);
  const gaussianOverlay = useMemo(()=>{
    if(!showGaussian && !showGaussianSignals) return null;
    const full = buildGaussianChannelOverlay(bars);
    return full ? {...full, showChannel:showGaussian, showSignals:showGaussianSignals} : null;
  },[showGaussian, showGaussianSignals, bars]);

  return (
    <div style={{display:'flex',flexDirection:'column',gap:28}}>
      {/* filters */}
      <div style={{display:'grid',gridTemplateColumns:'2fr 1.1fr 1.1fr',gap:18,alignItems:'end'}}>
        <label style={{display:'flex',flexDirection:'column',gap:8}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline}}>FIND TICKER</span>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'11px 14px',borderRadius:9,background:R(C.surfLowest,0.7),border:`1px solid ${R(C.outline,0.2)}`}}>
            <Icon n="search" size={17} color={C.outline}/>
            <input value={ticker} onChange={e=>setTicker(e.target.value)} placeholder="Symbol"
              style={{flex:1,minWidth:0,background:'transparent',border:'none',outline:'none',color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:14,letterSpacing:'0.04em',textTransform:'uppercase'}}/>
          </div>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:8}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline}}>STATUS</span>
          <div style={{position:'relative'}}>
            <select value={status} onChange={e=>setStatus(e.target.value)}
              style={{width:'100%',appearance:'none',WebkitAppearance:'none',padding:'11px 38px 11px 14px',borderRadius:9,background:R(C.surfLowest,0.7),border:`1px solid ${R(C.outline,0.2)}`,color:C.onSurf,fontFamily:"'JetBrains Mono',monospace",fontSize:13,cursor:'pointer',outline:'none'}}>
              {['All','READY','BLOCKED','NO LEVELS'].map(o=><option key={o} value={o}>{o}</option>)}
            </select>
            <Icon n="expand_more" size={18} color={C.outline} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}/>
          </div>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:8}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline}}>MINIMUM TRADE LEVELS</span>
          <div style={{display:'flex',alignItems:'stretch',gap:8}}>
            <div style={{flex:1,display:'flex',alignItems:'center',padding:'11px 14px',borderRadius:9,background:R(C.surfLowest,0.7),border:`1px solid ${R(C.outline,0.2)}`}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,color:C.lime}}>{minLevels}</span>
            </div>
            <button onClick={()=>setMinLevels(m=>Math.max(0,m-1))} style={{width:46,borderRadius:9,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(C.outline,0.2)}`,color:C.onVar,cursor:'pointer',fontFamily:"'Material Symbols Outlined'",fontSize:18}}>remove</button>
            <button onClick={()=>setMinLevels(m=>Math.min(20,m+1))} style={{width:46,borderRadius:9,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(C.outline,0.2)}`,color:C.onVar,cursor:'pointer',fontFamily:"'Material Symbols Outlined'",fontSize:18}}>add</button>
          </div>
        </label>
      </div>

      {selected && plan && (
        <>
          {/* Metrics */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:16}}>
            {[
              {label:'Last Price', value:fmtN(plan.price), valueColor:C.cyan},
              {label:'Daily ATR', value:fmtN(plan.daily_atr)},
              {label:'Technical ATR', value:fmtN(plan.technical_atr)},
              {label:'Trade Levels', value:plan.trade_levels?.length??0, valueColor:(plan.trade_levels?.length>0?C.lime:C.outline)},
            ].map((m,i)=>(
              <GlassCard key={i} style={{padding:18,display:'flex',flexDirection:'column',gap:13}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,letterSpacing:'0.05em',color:C.onVar}}>{m.label}</span>
                <div style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:32,fontWeight:600,lineHeight:1,color:m.valueColor||C.onSurf}}>{m.value}</div>
              </GlassCard>
            ))}
          </div>

          {/* Details row */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1.6fr 1fr',gap:16,alignItems:'start'}}>
            {/* Trade Context */}
            <GlassCard style={{overflow:'hidden'}}>
              <PanelHeader title="Trade Context"/>
              <Table cols={['Field','Value']} rows={[
                ['Clean room', plan.room||'—'],
                ['News status', plan.news||'—'],
                ['Security type', plan.security_type||'—'],
                ['Raw levels', plan.raw_levels?.length??'—'],
              ]}/>
            </GlassCard>

            {/* Optimized Trade Levels */}
            <GlassCard style={{overflow:'hidden'}}>
              <PanelHeader title="Optimized Trade Levels"/>
              <Table
                cols={['price','zone_low','zone_high','type','touches','false_breakouts','strength']}
                rows={(plan.trade_levels||[]).map(l=>[
                  <span style={{color:C.onSurf}}>{fmtN(l.price)}</span>,
                  <span style={{color:C.outline}}>{fmtN(l.zone_low)}</span>,
                  <span style={{color:C.outline}}>{fmtN(l.zone_high)}</span>,
                  <Pill text={l.type||'—'} color={l.type==='gap'?C.cyan:C.magenta}/>,
                  <span style={{color:C.cyan}}>{l.touches??'—'}</span>,
                  l.false_breakouts??'—',
                  <span style={{color:(l.strength_score>=0.75?C.lime:l.strength_score>=0.6?C.cyan:C.outline)}}>{l.strength_score?.toFixed(2)??'—'}</span>,
                ])}
              />
            </GlassCard>

            {/* Risk Headlines */}
            <GlassCard style={{overflow:'hidden'}}>
              <PanelHeader title="Risk Headlines"/>
              <div style={{padding:'16px 18px',display:'flex',flexDirection:'column',gap:14}}>
                {plan.headlines?.length>0 ? plan.headlines.map((h,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'flex-start',gap:9}}>
                    <Icon n="warning" size={16} color={C.err} style={{flexShrink:0}}/>
                    <span style={{fontFamily:"'Inter',sans-serif",fontSize:'12.5px',lineHeight:1.5,color:C.onVar}}>{h}</span>
                  </div>
                )) : <span style={{fontFamily:"'Inter',sans-serif",fontSize:13,color:C.outline}}>No matched risk headlines.</span>}
                <div onClick={()=>setAllLevelsOpen(o=>!o)}
                  style={{display:'flex',alignItems:'center',gap:9,padding:'12px 14px',borderRadius:9,cursor:'pointer',background:R(C.surfLowest,0.5),border:`1px solid ${R(C.outline,0.16)}`}}>
                  <Icon n={allLevelsOpen?'expand_more':'chevron_right'} size={17} color={C.outline}/>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar}}>All detected levels ({plan.raw_levels?.length??0})</span>
                </div>
                {allLevelsOpen && (
                  <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:220,overflowY:'auto'}}>
                    {(plan.raw_levels||[]).slice().sort((a,b)=>(b.price||0)-(a.price||0)).map((l,i)=>(
                      <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 11px',borderRadius:7,background:R(C.surfLowest,0.4)}}>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onSurf}}>{fmtN(l.price)}</span>
                        <Pill text={l.type||'—'} color={l.type==='gap'?C.cyan:C.magenta}/>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline}}>{l.touches??'?'}T</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </GlassCard>
          </div>
        </>
      )}

      {!selected && ticker && (
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'18px 20px',borderRadius:12,background:R(C.surf,0.5),border:`1px solid ${R(C.outline,0.18)}`}}>
          <Icon n="search_off" size={20} color={C.outline}/>
          <span style={{fontFamily:"'Inter',sans-serif",fontSize:13,color:C.onVar}}>No watchlist symbol matches <span style={{color:C.onSurf,fontFamily:"'JetBrains Mono',monospace"}}>{ticker.toUpperCase()}</span>.</span>
        </div>
      )}

      {/* Opportunity Queue */}
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="playlist_add_check" title="Opportunity Queue"/>
        <Table
          cols={['Asset','Status','Trade Levels','Room','Daily ATR','Price']}
          rows={filtered.map(o=>[
            <span style={{display:'inline-flex',alignItems:'center',gap:8,color:C.onSurf,fontWeight:500}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:o.status==='READY'?C.lime:o.status==='BLOCKED'?C.err:C.outline,display:'inline-block',flexShrink:0}}/>
              {o.symbol}
            </span>,
            <Pill text={o.status} color={o.status==='READY'?C.lime:o.status==='BLOCKED'?C.err:C.outline}/>,
            o.trade_levels,
            <span style={{color:C.outline}}>{o.room||'—'}</span>,
            o.daily_atr?.toFixed(2)||'—',
            o.price ? `$${Number(o.price).toFixed(2)}` : '—',
          ])}
        />
      </GlassCard>

      {/* Chart */}
      {selected && (
        <GlassCard style={{overflow:'hidden'}}>
          <div style={{padding:'16px 20px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Icon n="candlestick_chart" size={17} color={C.outline}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>{selected} · {TF_LABEL[tf]} Levels</span>
            </div>
            <TfPills value={tf} onChange={setTf}/>
          </div>
          <div style={{padding:'12px 20px',borderBottom:`1px solid ${R(C.outline,0.1)}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:14}}>
            <div style={{display:'flex',gap:22,flexWrap:'wrap'}}>
              <Toggle on={showRaw} label="Raw levels" onChange={setShowRaw}/>
              <Toggle on={showTrade} label="Trade zones" onChange={setShowTrade}/>
              <Toggle on={showVol} label="Volume" onChange={setShowVol}/>
              <Toggle on={showGaussian} label="Gaussian channel" onChange={v=>{setShowGaussian(v); if(v) setShowGaussianSignals(true);}}/>
              <Toggle on={showGaussianSignals} label="Gaussian signals" onChange={setShowGaussianSignals}/>
            </div>
          </div>
          <div style={{padding:'18px 20px'}}>
            <CandleChart bars={bars} levels={chartLevels} gaussianOverlay={gaussianOverlay} showVol={showVol} height={600} stale={barsInfo.stale} lastDate={barsInfo.lastDate}/>
          </div>
        </GlassCard>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   TAB: INTRADAY
═══════════════════════════════════════════════════════════════════════════ */
function TabIntraday({refreshKey=0}) {
  const [data, setData] = useState(null);
  useEffect(()=>{ fetch(`${API}/intraday`).then(r=>r.json()).then(setData); },[refreshKey]);
  if(!data) return <Spinner/>;
  const {metrics:m, attempts} = data;
  const sessionCards = [
    {label:'Attempts', icon:'replay', value:m.attempts, sub:'levels evaluated'},
    {label:'Submitted', icon:'check_circle', value:m.buys+m.sells, sub:'action signals', subColor:C.lime, valueColor:C.lime},
    {label:'Date', icon:'calendar_today', value:m.date||'—'},
    {label:'Symbols Evaluated', icon:'bar_chart', value:m.symbols_evaluated},
  ];

  const recent = [...(attempts||[])].sort((a,b)=>String(b.timestamp||'').localeCompare(String(a.timestamp||''))).slice(0,20);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:28}}>
      <MetricGrid items={sessionCards}/>
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="receipt_long" title="Decision Log"/>
        <Table
          cols={['Time','Asset','Strategy','Decision','Reason']}
          rows={recent.map(a=>{
            const sig=String(a.signal||'').toUpperCase();
            const sc=sig==='BUY'?C.lime:sig==='SELL'?C.err:C.outline;
            return [
              <span style={{color:C.outline}}>{String(a.timestamp||'—').replace('T',' ')}</span>,
              <span style={{color:C.onSurf,fontWeight:500}}>{a.symbol||'—'}</span>,
              <span style={{fontFamily:"'Inter',sans-serif",color:C.onVar}}>{a.strategy||'—'}</span>,
              sig?<Pill text={sig} color={sc}/>:'—',
              <span style={{color:C.outline,fontFamily:"'Inter',sans-serif"}}>{Array.isArray(a.reason)?a.reason.join('; '):String(a.reason||'—')}</span>,
            ];
          })}
        />
      </GlassCard>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   TAB: TRADES
═══════════════════════════════════════════════════════════════════════════ */
function TabStrategy({refreshKey=0}) {
  const [data, setData] = useState(null);
  const [filter, setFilter] = useState('ALL');
  const [selectedSymbol, setSelectedSymbol] = useState(null);
  const [tf, setTf] = useState('1W');
  const [range, setRange] = useState('ALL');
  const [showRaw, setShowRaw] = useState(false);
  const [showTrade, setShowTrade] = useState(true);
  const [showVol, setShowVol] = useState(true);
  const [showStrategy, setShowStrategy] = useState(false);
  const [showStrategy2, setShowStrategy2] = useState(true);
  const [showManualSetup, setShowManualSetup] = useState(false);
  const [showGaussian, setShowGaussian] = useState(false);
  const [showGaussianSignals, setShowGaussianSignals] = useState(false);
  const [manualEntry, setManualEntry] = useState('');
  const [manualStop, setManualStop] = useState('');
  const [manualTarget, setManualTarget] = useState('');
  const [manualSide, setManualSide] = useState('LONG');
  const [manualCash, setManualCash] = useState('1000');
  const [manualMaxOpenRisk, setManualMaxOpenRisk] = useState('5');
  const [strategyFeedback, setStrategyFeedback] = useState(null);
  const [strategyConfirm, setStrategyConfirm] = useState(null);
  const [strategySymbolAddOpen, setStrategySymbolAddOpen] = useState(false);
  const [strategyNewSymbol, setStrategyNewSymbol] = useState('');
  const [strategySymbolBusy, setStrategySymbolBusy] = useState(false);
  const [strategySymbolFeedback, setStrategySymbolFeedback] = useState(null);
  const [strategyRemoveConfirm, setStrategyRemoveConfirm] = useState(null);
  const [bars, setBars] = useState([]);
  const [barsInfo, setBarsInfo] = useState({stale:false,lastDate:null});
  const [chartPlan, setChartPlan] = useState(null);
  const strategyChartFullscreenRef = useRef(null);
  const loadStrategy = useCallback(()=>{
    fetch(`${API}/strategy`)
      .then(r=>r.json())
      .then(setData)
      .catch(()=>setData({rows:[],symbols:[],symbols_scanned:0,matches:0,crossed:0,near:0}));
  },[]);
  useEffect(()=>{ loadStrategy(); },[refreshKey, loadStrategy]);
  useEffect(()=>{
    const symbols = data?.symbols || [];
    const first = data?.rows?.[0]?.symbol || symbols[0];
    if(first && (!selectedSymbol || !symbols.includes(selectedSymbol))) setSelectedSymbol(first);
    if(!first && selectedSymbol) setSelectedSymbol(null);
  },[data, selectedSymbol]);
  useEffect(()=>{
    if(!selectedSymbol) {
      setBars([]);
      setBarsInfo({stale:false,lastDate:null});
      setChartPlan(null);
      return;
    }
    const apitf = TF_API[tf]||'weekly';
    fetch(`${API}/bars/${selectedSymbol}/${apitf}`)
      .then(r=>r.json())
      .then(d=>{setBars(d.bars||[]);setBarsInfo({stale:d.stale,lastDate:d.last_date});})
      .catch(()=>{setBars([]);setBarsInfo({stale:false,lastDate:null});});
    fetch(`${API}/preopen/${selectedSymbol}`)
      .then(r=>r.json())
      .then(setChartPlan)
      .catch(()=>setChartPlan(null));
  },[selectedSymbol, tf, refreshKey]);
  useEffect(()=>{
    setManualStop('');
    setManualTarget('');
  },[selectedSymbol, manualSide]);
  const submitStrategySymbolAdd = useCallback(async()=>{
    const symbol = strategyNewSymbol.trim().toUpperCase();
    if(!symbol) return;
    setStrategySymbolBusy(true);
    setStrategySymbolFeedback(null);
    try {
      const r = await fetch(`${API}/watchlist/add`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol}),
      });
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.detail || d.message || 'Failed to submit symbol');
      setStrategySymbolFeedback({ok:true, message:d.message});
      setStrategyNewSymbol('');
      setStrategySymbolAddOpen(false);
      setSelectedSymbol(symbol);
      loadStrategy();
    } catch(e) {
      setStrategySymbolFeedback({ok:false, message:String(e.message||e)});
    } finally {
      setStrategySymbolBusy(false);
    }
  },[strategyNewSymbol, loadStrategy]);
  const submitStrategySymbolRemove = useCallback(async()=>{
    const symbol = String(strategyRemoveConfirm?.symbol || '').trim().toUpperCase();
    if(!symbol) return;
    setStrategySymbolBusy(true);
    setStrategySymbolFeedback(null);
    try {
      const r = await fetch(`${API}/watchlist/remove`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol}),
      });
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.detail || d.message || 'Failed to remove symbol');
      setStrategySymbolFeedback({ok:true, message:d.message});
      setStrategyRemoveConfirm(null);
      if(selectedSymbol === symbol) setSelectedSymbol(null);
      loadStrategy();
    } catch(e) {
      setStrategySymbolFeedback({ok:false, message:String(e.message||e)});
    } finally {
      setStrategySymbolBusy(false);
    }
  },[strategyRemoveConfirm, selectedSymbol, loadStrategy]);
  const rangeCount = RANGE_COUNTS[range]||9999;
  const visibleBars = bars.slice(-rangeCount);
  const strategyOverlay = useMemo(
    ()=>{
      const overlays = [
        showStrategy ? sliceOverlayPoints(buildBmsbStrategyOverlay(bars), rangeCount) : null,
        showStrategy2 ? sliceOverlayPoints(buildBmsbStrategy2Overlay(bars), rangeCount) : null,
      ].filter(Boolean);
      return overlays.length ? overlays : null;
    },
    [showStrategy, showStrategy2, bars, rangeCount]
  );
  const gaussianOverlay = useMemo(()=>{
    if(!showGaussian && !showGaussianSignals) return null;
    const full = buildGaussianChannelOverlay(bars);
    return full ? {...full, showChannel:showGaussian, showSignals:showGaussianSignals, points: full.points.slice(-rangeCount)} : null;
  },[showGaussian, showGaussianSignals, bars, rangeCount]);
  const chartLevels = useMemo(
    ()=>buildChartLevels(chartPlan?.trade_levels, chartPlan?.raw_levels, showTrade, showRaw),
    [chartPlan, showTrade, showRaw]
  );
  const manualSetup = useMemo(()=>{
    const entry = Number(manualEntry);
    if(!Number.isFinite(entry) || entry<=0) return null;
    const sourceLevels = (chartPlan?.trade_levels?.length ? chartPlan.trade_levels : chartPlan?.raw_levels) || [];
    const atr = Number(chartPlan?.daily_atr || chartPlan?.technical_atr || 0);
    const buffer = Math.max(entry*0.001, atr*0.05, entry>=1?0.01:0.0001);
    const norm = (l) => {
      const price = Number(l.price ?? l.center);
      const zl = Number(l.zone_low), zh = Number(l.zone_high);
      const hasZone = Number.isFinite(zl) && Number.isFinite(zh);
      return Number.isFinite(price) && price>0 ? {
        price,
        low: hasZone ? Math.min(zl, zh) : price,
        high: hasZone ? Math.max(zl, zh) : price,
        type: l.type || 'level',
      } : null;
    };
    const levels = sourceLevels.map(norm).filter(Boolean).sort((a,b)=>a.price-b.price);
    const lower = [...levels].reverse().find(l=>l.high < entry || l.price < entry);
    const upper = levels.find(l=>l.low > entry || l.price > entry);
    const side = manualSide === 'SHORT' ? 'SHORT' : 'LONG';
    let autoStop, autoTarget, method;
    if(side === 'LONG'){
      autoStop = lower ? lower.low - buffer : entry - Math.max(atr || 0, entry*0.02);
      autoTarget = upper ? upper.low : entry + Math.abs(entry-autoStop)*3;
      method = `${lower?'nearest lower level':'ATR fallback'} / ${upper?'nearest upper level':'3R fallback'}`;
    } else {
      autoStop = upper ? upper.high + buffer : entry + Math.max(atr || 0, entry*0.02);
      autoTarget = lower ? lower.high : entry - Math.abs(autoStop-entry)*3;
      method = `${upper?'nearest upper level':'ATR fallback'} / ${lower?'nearest lower level':'3R fallback'}`;
    }
    const stopOverride = Number(manualStop);
    const targetOverride = Number(manualTarget);
    const stop = Number.isFinite(stopOverride) && stopOverride > 0 ? stopOverride : autoStop;
    const target = Number.isFinite(targetOverride) && targetOverride > 0 ? targetOverride : autoTarget;
    const validDirection = side === 'LONG'
      ? stop < entry && target > entry
      : stop > entry && target < entry;
    if(!validDirection) return null;
    const risk = Math.abs(entry-stop);
    const reward = Math.abs(target-entry);
    if(risk<=0 || reward<=0 || stop<=0 || target<=0) return null;
    return {
      side, entry, stop, target,
      autoStop, autoTarget,
      stopOverridden:Number.isFinite(stopOverride) && stopOverride > 0,
      targetOverridden:Number.isFinite(targetOverride) && targetOverride > 0,
      rr: reward/risk,
      method,
    };
  },[manualEntry, manualStop, manualTarget, manualSide, chartPlan]);
  const manualOrderPlan = useMemo(()=>{
    if(!manualSetup || !selectedSymbol) return null;
    const cash = Number(manualCash);
    const maxOpenRiskPct = Number(manualMaxOpenRisk);
    if(!Number.isFinite(cash) || cash<=0 || !Number.isFinite(maxOpenRiskPct) || maxOpenRiskPct<=0) return null;
    const riskPerShare = Math.abs(manualSetup.entry-manualSetup.stop);
    const rewardPerShare = Math.abs(manualSetup.target-manualSetup.entry);
    if(riskPerShare<=0 || rewardPerShare<=0) return null;
    const maxRiskAmount = cash * (maxOpenRiskPct/100);
    const riskQty = Math.floor(maxRiskAmount / riskPerShare);
    const cashQty = Math.floor(cash / manualSetup.entry);
    const quantity = Math.max(0, Math.min(riskQty, cashQty));
    const riskAmount = quantity * riskPerShare;
    const potentialProfit = quantity * rewardPerShare;
    const positionValue = quantity * manualSetup.entry;
    return {
      symbol:selectedSymbol,
      signal:manualSetup.side==='SHORT'?'SELL':'BUY',
      direction:manualSetup.side.toLowerCase(),
      entry:manualSetup.entry,
      stop:manualSetup.stop,
      target:manualSetup.target,
      reward_risk:manualSetup.rr,
      quantity,
      risk_amount:riskAmount,
      potential_reward:potentialProfit,
      position_value:positionValue,
      max_risk_amount:maxRiskAmount,
      available_cash:cash,
      max_open_risk_pct:maxOpenRiskPct,
      entry_order_type:'LIMIT',
      strategy:'strategy_manual_setup',
      source:'STRATEGY_MANUAL',
      level_type:'dashboard_manual',
      confidence:1,
    };
  },[manualSetup, selectedSymbol, manualCash, manualMaxOpenRisk]);
  const doStrategyPlace = useCallback(async(row) => {
    setStrategyConfirm(null);
    try {
      const r = await fetch(`${API}/order/place`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});
      const d = await r.json();
      setStrategyFeedback({ok:d.ok, message:d.message, id:d.id, dryRun:d.dry_run});
    } catch(e) { setStrategyFeedback({ok:false, message:'Network error: '+e.message}); }
  },[]);
  const manualSetupLines = showManualSetup && manualSetup ? [
    {p:manualSetup.target,color:C.lime,label:`TARGET $${manualSetup.target.toFixed(2)}`},
    {p:manualSetup.entry,color:C.ocean,label:`ENTRY $${manualSetup.entry.toFixed(2)}`},
    {p:manualSetup.stop,color:C.err,label:`STOP $${manualSetup.stop.toFixed(2)}`},
  ] : [];
  const manualSetupZones = showManualSetup && manualSetup ? [
    {p1:manualSetup.entry,p2:manualSetup.target,color:C.lime,opacity:0.07},
    {p1:manualSetup.entry,p2:manualSetup.stop,color:C.err,opacity:0.08},
  ] : [];
  if(!data) return <Spinner/>;

  const rows = (data.rows||[]).filter(r=>{
    if(filter==='ALL') return true;
    if(filter==='CROSSED') return r.urgency==='crossed';
    if(filter==='NEAR') return r.urgency==='near';
    return r.side===filter;
  });
  const allStockSymbols = data.symbols?.length
    ? data.symbols
    : [...new Set((data.rows||[]).map(r=>r.symbol).filter(Boolean))].sort();
  const selectedRow = (data.rows||[]).find(r=>r.symbol===selectedSymbol) || rows[0] || data.rows?.[0] || null;
  const chartSymbolLabel = selectedSymbol || selectedRow?.symbol || 'SELECT SYMBOL';
  const signalColor = signal => {
    if(String(signal).includes('LONG')) return '#1f8bff';
    if(String(signal).includes('EXIT')) return '#ff1744';
    return C.outline;
  };
  const fmtNum = (v, d=2) => v==null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(d);
  const manualEntryReady = Number.isFinite(Number(manualEntry)) && Number(manualEntry) > 0;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:28}}>
      <MetricGrid items={[
        {label:'Symbols Scanned', icon:'radar', value:data.symbols_scanned??0, sub:'with stored chart data'},
        {label:'BMSB S2 Matches', icon:'candlestick_chart', value:data.matches??0, valueColor:C.cyan, sub:'entry/exit or near trigger', subColor:C.cyan},
        {label:'Recent Triggers', icon:'swap_vert', value:data.crossed??0, valueColor:data.crossed?C.lime:C.onSurf, sub:`last ${data.recent_days??2} days`},
        {label:'Near Trigger', icon:'near_me', value:data.near??0, valueColor:data.near?C.magenta:C.onSurf, sub:`≤ ${fmtNum(data.threshold_pct,2)}% to S2 level`},
      ]}/>

      <div ref={strategyChartFullscreenRef} className="strategy-chart-fullscreen-shell">
      <GlassCard style={{overflow:'hidden'}}>

            fmtNum(r.sma20,2),
            <span style={{color:C.outline}}>{r.cross_date||'—'}</span>,
            <span style={{color:C.outline}}>{r.weekly_bar||'—'}</span>,
          ])}
        />
        {!rows.length && (
          <div style={{padding:'20px 18px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>
            No BMSB Strategy 2 symbols match this filter right now.

        )}
      </GlassCard>
    </div>
  );
}

function TabTrades({refreshKey=0}) {
  const [data, setData] = useState(null);
  useEffect(()=>{ fetch(`${API}/trades`).then(r=>r.json()).then(setData); },[refreshKey]);
  if(!data) return <Spinner/>;
  const {positions, executed, skipped, order_requests, open_requests, worker_alive, worker_age, trade_log} = data;
  const fmtP = v => v!=null ? `$${Number(v).toFixed(2)}` : '—';

  return (
    <div style={{display:'flex',flexDirection:'column',gap:28}}>
      <MetricGrid items={[
        {label:'Open Positions', icon:'account_balance_wallet', value:positions?.length??0, sub:`/ 5 max`, valueColor:C.cyan},
        {label:'Executed (latest)', icon:'task_alt', value:executed?.length??0, sub:'paper orders', subColor:C.lime, valueColor:C.lime},
        {label:'Skipped (latest)', icon:'block', value:skipped?.length??0},
        {label:'Pending Requests', icon:'pending', value:open_requests??0, valueColor:open_requests>0?C.err:C.onSurf},
      ]}/>

      {/* Worker status */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:10,
        background:worker_alive?R(C.lime,0.06):R(C.err,0.06),
        border:`1px solid ${worker_alive?R(C.lime,0.22):R(C.err,0.22)}`}}>
        <Icon n={worker_alive?'check_circle':'warning'} size={18} color={worker_alive?C.lime:C.err}/>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:worker_alive?C.lime:C.err}}>
          {worker_alive ? `Execute worker online · last heartbeat ${Math.round(worker_age||0)}s ago` : `Execute worker offline${worker_age!=null?` · last heartbeat ${Math.round(worker_age)}s ago`:''}`}
        </span>
      </div>

      {/* Open Positions */}
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="swap_horiz" title="Open Paper Positions" badge="PAPER"/>
        {positions?.length>0 ? (
          <Table
            cols={['Asset','Side','Qty','Entry','Stop','Target','Unrealized P&L']}
            rows={positions.map(p=>{
              const side=String(p.side||p.signal||'—').toUpperCase();
              return [
                <span style={{color:C.onSurf,fontWeight:500}}>{p.symbol}</span>,
                <Pill text={side} color={side==='BUY'?C.lime:side==='SELL'?C.err:C.outline}/>,
                p.quantity??'—',
                fmtP(p.entry||p.avg_cost),
                fmtP(p.stop_loss||p.stop),
                fmtP(p.target),
                '—',
              ];
            })}
          />
        ) : <div style={{padding:'20px 18px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>No tracked positions.</div>}
      </GlassCard>

      {/* Order Requests */}
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="send" title="Order Requests" badge="PAPER"/>
        {order_requests?.length>0 ? (
          <Table
            cols={['Time','Action','Symbol','Side','Status','Detail']}
            rows={order_requests.slice(0,20).map(r=>{
              const st=String(r.status||'').toUpperCase();
              const stc=st==='DONE'?C.lime:st==='ERROR'||st==='REJECTED'?C.err:C.cyan;
              return [
                <span style={{color:C.outline}}>{String(r.updated_at||'—').replace('T',' ')}</span>,
                String(r.action||'—').toUpperCase(),
                <span style={{color:C.onSurf,fontWeight:500}}>{r.symbol||'—'}</span>,
                r.signal||'—',
                <Pill text={st||'—'} color={stc}/>,
                <span style={{color:C.outline,fontFamily:"'Inter',sans-serif"}}>{r.message||'—'}</span>,
              ];
            })}
          />
        ) : <div style={{padding:'20px 18px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>No order requests yet.</div>}
      </GlassCard>

      {/* Trade Journal */}
      <GlassCard style={{overflow:'hidden'}}>
        <PanelHeader icon="menu_book" title="Recent Trade Journal"/>
        <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:10}}>
          {trade_log?.length>0 ? trade_log.map((s,i)=>(
            <details key={i} style={{borderRadius:8,border:`1px solid ${R(C.outline,0.14)}`,overflow:'hidden'}}>
              <summary style={{padding:'10px 14px',cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar,background:R(C.surfLowest,0.4)}}>{s.heading}</summary>
              <pre style={{padding:'12px 14px',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.outline,overflowX:'auto',whiteSpace:'pre-wrap',margin:0}}>{s.body||'(empty)'}</pre>
            </details>
          )) : <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.outline}}>No trade log sections available.</span>}
        </div>
      </GlassCard>
    </div>
  );
}

              </div>

                <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.08em',color:C.outline,textTransform:'uppercase'}}>Ledger Symbol</span>
                  <select value={fcLedgerSymbol} onChange={e=>{setFcLedgerSymbol(e.target.value); if(e.target.value) setFcSel(e.target.value);}}
                    style={{minWidth:180,background:R(C.surfLowest,0.8),color:C.onSurf,border:`1px solid ${R(C.outline,0.25)}`,borderRadius:8,padding:'8px 11px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.04em'}}>
                    <option value="">All symbols</option>
                    {forecastSymbols.map(symbol=><option key={symbol} value={symbol}>{symbol}</option>)}
                  </select>
                  {fcLedgerSymbol && <Pill text={`FILTER: ${fcLedgerSymbol}`} color={C.cyan}/>}
                </div>
              )}
            </div>
            {feedback && (
              <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:16,padding:'12px 16px',borderRadius:10,
                background:feedback.ok?R(C.lime,0.07):R(C.err,0.07),
                border:`1px solid ${feedback.ok?R(C.lime,0.25):R(C.err,0.25)}`}}>
                <Icon n={feedback.ok?'task_alt':'error'} size={18} color={feedback.ok?C.lime:C.err} style={{flexShrink:0}}/>
                <div style={{flex:1}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'11.5px',lineHeight:1.5,color:feedback.ok?'#dbe9b0':C.err}}>{feedback.message}</span>
                  {feedback.id && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginLeft:12}}>ID: {feedback.id}</span>}
                  {feedback.dryRun && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.magenta,marginLeft:12}}>DRY_RUN — no real order sent</span>}
                </div>
                <button onClick={()=>setFeedback(null)} style={{background:'none',border:'none',cursor:'pointer',color:C.outline,padding:4}}>
                  <Icon n="close" size={16} color={C.outline}/>
                </button>
              </div>
            )}
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',minWidth:780}}>
                <thead><tr>{['Symbol','Side','Entry','Stop','Target','R:R','Shares','Risk $','Pot. Reward','Status','Reason','Actions'].map(c=>(
                  <th key={c} style={{padding:'11px 16px',textAlign:c==='Actions'?'right':'left',fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',textTransform:'uppercase',color:C.outline,borderBottom:`1px solid ${R(C.outline,0.12)}`,whiteSpace:'nowrap'}}>{c}</th>
                ))}</tr></thead>
                <tbody>{ledgerSrc.map((r,i)=>{
                  const filtered=r.status!=='FORECAST TRADE';
                  const rr=Number(r.reward_risk||0);
                  const rrOk=rr>=Number(fc.minRR);
                  const sc=r.signal==='BUY'?C.lime:C.err;
                  const qtyRaw = i in qtyOverrides ? qtyOverrides[i] : String(r.quantity||0);
                  const qty=Math.max(0, Math.floor(Number(qtyRaw)||0));
                  const qtyEdited = qty !== Number(r.quantity||0);
                  const entry=Number(r.entry||0), stop=Number(r.stop||0), target=Number(r.target||0);
                  const riskDollar=qty>0&&stop>0 ? qty*Math.abs(entry-stop) : null;
                  const rewardDollar=qty>0&&target>0 ? qty*Math.abs(target-entry) : null;
                  return (
                    <tr key={i} onMouseEnter={e=>e.currentTarget.style.background=R('#fff',0.025)} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`}}>
                        <button onClick={()=>setFcSel(r.symbol)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'7px 15px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:500,color:r.symbol===fcSel?'#001416':C.onSurf,background:r.symbol===fcSel?C.cyan:'rgba(20,20,21,0.7)',border:`1px solid ${r.symbol===fcSel?C.cyan:'rgba(132,148,149,0.22)'}`}}>{r.symbol}</button>
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:sc,fontWeight:500}}>{r.signal}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.onVar}}>${entry.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.outline}}>${stop.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:C.outline}}>${target.toFixed(2)}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:rrOk?C.lime:C.outline}}>{rr.toFixed(2)}</td>
                      <td style={{padding:'8px 16px',borderBottom:`1px solid ${R(C.outline,0.06)}`}}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <input
                            type="number" min="0" step="1"
                            value={qtyRaw}
                            onChange={e=>setQtyOverride(i, e.target.value)}
                            onBlur={e=>{ const v=Math.max(0,Math.floor(Number(e.target.value)||0)); setQtyOverride(i,String(v)); }}
                            style={{width:70,padding:'5px 8px',borderRadius:7,fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                              color:qtyEdited?C.cyan:C.onVar,
                              background:qtyEdited?R(C.cyan,0.08):'rgba(28,27,28,0.7)',
                              border:`1px solid ${qtyEdited?R(C.cyan,0.4):R(C.outline,0.22)}`,
                              outline:'none',textAlign:'right'}}
                          />
                          {qtyEdited&&<button title="Reset to calculated" onClick={()=>setQtyOverride(i,String(r.quantity||0))}
                            style={{background:'none',border:'none',cursor:'pointer',padding:2,color:C.outline,lineHeight:1}}>
                            <Icon n="restart_alt" size={14} color={C.outline}/>
                          </button>}
                        </div>
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:riskDollar!=null?C.err:C.outline,fontWeight:500}}>{riskDollar!=null?`$${riskDollar.toFixed(2)}`:'—'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:rewardDollar!=null?C.lime:C.outline,fontWeight:500}}>{rewardDollar!=null?`$${rewardDollar.toFixed(2)}`:'—'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,color:filtered?C.outline:C.lime}}>{filtered?'Filtered':'Eligible'}</td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`,maxWidth:260}}>
                        {filtered ? (
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {(r.reason_codes&&r.reason_codes.length?r.reason_codes:[r.reason||'filtered']).map((code,ci)=>{
                              const labels={'daily_loss_limit_reached':'Daily loss limit','entry_too_close_to_market':'Entry too close','entry_too_far_from_market':'Entry too far','duplicate_position':'Duplicate position','max_positions_reached':'Max positions','reward_risk_too_low':'R:R too low','spread_too_wide':'Spread too wide','position_size_zero':'Size = 0','position_value_invalid':'Position value','open_risk_limit_exceeded':'Open risk limit'};
                              const label=labels[code]||(typeof code==='string'?code.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):String(code));
                              return <span key={ci} style={{display:'inline-block',padding:'2px 8px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.err,background:R(C.err,0.10),border:`1px solid ${R(C.err,0.22)}`,whiteSpace:'nowrap'}}>{label}</span>;
                            })}
                          </div>
                        ) : (()=>{
                          const strategyLabels={
                            'rebound':'Rebound',
                            'confirmed_breakout':'Confirmed Breakout',
                            'false_breakout_one_bar':'False Breakout',
                            'level_retest_forecast':'Level Retest',
                            'level_breakout_forecast':'Level Breakout',
                          };
                          const sourceLabels={
                            'ACTIVE REPLAY':'Live signal',
                            'PROJECTED':'Projected',
                          };
                          const stratLabel=strategyLabels[r.strategy]||(r.strategy||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())||null;
                          const srcLabel=sourceLabels[r.source]||r.source||null;
                          const checks=[];
                          if(rr>0) checks.push(`R:R ${rr.toFixed(2)} ≥ ${Number(fc.minRR).toFixed(1)}`);
                          if(r.entry_distance_atr!=null) checks.push(`${Number(r.entry_distance_atr).toFixed(2)} ATR dist`);
                          if(qty>0&&entry>0) checks.push(`${qty} sh @ $${entry.toFixed(2)}`);
                          if(rewardDollar!=null) checks.push(`+$${rewardDollar.toFixed(0)} target`);
                          return (
                            <div style={{display:'flex',flexDirection:'column',gap:5}}>
                              {/* strategy + source line */}
                              <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                                {stratLabel&&<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,color:C.cyan,background:R(C.cyan,0.1),border:`1px solid ${R(C.cyan,0.28)}`}}>
                                  <Icon n="strategy" size={11} color={C.cyan}/>{stratLabel}
                                </span>}
                                {srcLabel&&<span style={{padding:'2px 8px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:r.source==='ACTIVE REPLAY'?C.lime:C.onVar,background:r.source==='ACTIVE REPLAY'?R(C.lime,0.08):R(C.outline,0.08),border:`1px solid ${r.source==='ACTIVE REPLAY'?R(C.lime,0.22):R(C.outline,0.18)}`}}>{srcLabel}</span>}
                              </div>
                              {/* check pills */}
                              <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
                                <Icon n="check_circle" size={11} color={C.lime}/>
                                {checks.map((c,ci)=>(
                                  <span key={ci} style={{padding:'1px 7px',borderRadius:9999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#9ecfb0',background:'rgba(100,180,120,0.08)',border:'1px solid rgba(100,180,120,0.18)',whiteSpace:'nowrap'}}>{c}</span>
                                ))}
                              </div>
                            </div>
                          );
                        })()}
                      </td>
                      <td style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,borderBottom:`1px solid ${R(C.outline,0.06)}`}}>
                        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                          <button onClick={()=>!filtered&&setConfirm({type:'place',row:{...r,quantity:qty}})}
                            style={{padding:'7px 16px',borderRadius:7,cursor:filtered?'not-allowed':'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:filtered?C.outline:C.cyan,background:filtered?'rgba(28,27,28,0.4)':R(C.cyan,0.1),border:`1px solid ${filtered?'rgba(132,148,149,0.14)':R(C.cyan,0.4)}`,opacity:filtered?0.45:1}}>Place</button>
                          <button onClick={()=>setConfirm({type:'close',row:r})}
                            style={{padding:'7px 16px',borderRadius:7,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.onVar,background:'rgba(28,27,28,0.6)',border:`1px solid rgba(132,148,149,0.22)`}}>Close</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}</tbody>
              </table>
            </div>

            {/* Expanded full table toggle */}
            <div onClick={()=>setFcExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,marginTop:16,padding:'13px 16px',borderRadius:10,cursor:'pointer',background:R(C.surfLowest,0.5),border:`1px solid ${R(C.outline,0.16)}`}}>
              <Icon n={fcExpanded?'expand_more':'chevron_right'} size={18} color={C.outline}/>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar}}>Full ledger table (all columns, sortable)</span>
            </div>
            {fcExpanded && (
              <div style={{overflowX:'auto',marginTop:12,border:`1px solid ${R(C.outline,0.14)}`,borderRadius:10}}>
                <table style={{width:'100%',borderCollapse:'collapse',minWidth:1180}}>
                  <thead><tr>{['Symbol','Source','Strategy','Side','Current','Entry','Dist %','Dist ATR','Stop','Target','R:R','Shares','Pos Value','Risk $','Pot Reward','Status'].map(c=>(
                    <th key={c} style={{padding:'11px 16px',textAlign:'left',fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.07em',textTransform:'uppercase',color:C.outline,borderBottom:`1px solid ${R(C.outline,0.12)}`,whiteSpace:'nowrap'}}>{c}</th>
                  ))}</tr></thead>
                  <tbody>{rows.map((r,i)=>(
                    <tr key={i} onMouseEnter={e=>e.currentTarget.style.background=R('#fff',0.025)} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      {[
                        <span style={{color:C.onSurf,fontWeight:500}}>{r.symbol}</span>,
                        <Pill text={r.source||'—'} color={r.source==='ACTIVE REPLAY'?C.cyan:C.magenta}/>,
                        <span style={{fontFamily:"'Inter',sans-serif",color:C.onVar}}>{r.strategy}</span>,
                        <span style={{color:r.signal==='BUY'?C.lime:C.err}}>{r.signal}</span>,
                        r.current_price?`$${Number(r.current_price).toFixed(2)}`:'—',
                        `$${Number(r.entry||0).toFixed(2)}`,
                        r.entry_distance_pct!=null?`${(r.entry_distance_pct*100).toFixed(1)}%`:'—',
                        r.entry_distance_atr!=null?Number(r.entry_distance_atr).toFixed(2):'—',
                        `$${Number(r.stop||0).toFixed(2)}`,
                        `$${Number(r.target||0).toFixed(2)}`,
                        <span style={{color:Number(r.reward_risk||0)>=Number(fc.minRR)?C.lime:C.outline}}>{Number(r.reward_risk||0).toFixed(2)}</span>,
                        r.quantity>0?r.quantity:'—',
                        r.quantity>0?`$${Math.round(r.position_value||0).toLocaleString()}`:'—',
                        r.quantity>0?`$${Math.round(r.risk_amount||0).toLocaleString()}`:'—',
                        <span style={{color:C.lime}}>{r.quantity>0?`$${Math.round(r.potential_reward||0).toLocaleString()}`:'—'}</span>,
                        <Pill text={r.status==='FORECAST TRADE'?'ELIGIBLE':'FILTERED'} color={r.status==='FORECAST TRADE'?C.lime:C.outline}/>,
                      ].map((cell,j)=>(
                        <td key={j} style={{padding:'11px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:11,borderBottom:`1px solid ${R(C.outline,0.06)}`,whiteSpace:'nowrap',color:C.onVar}}>{cell}</td>
                      ))}
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
          </div>
        </GlassCard>

        {/* Selected symbol chart */}
        {selRow && (
          <GlassCard style={{overflow:'hidden'}}>
            <div style={{padding:'16px 20px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <Icon n="candlestick_chart" size={17} color={C.outline}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,letterSpacing:'0.1em',textTransform:'uppercase',color:C.onVar}}>{selRow.symbol} · {TF_LABEL[tf]} Forecast Position</span>
                <Pill text={`${selRow.signal} · ${selRow.source}`} color={C.cyan}/>
              </div>
              <TfPills value={tf} onChange={setTf}/>
            </div>
            <div style={{padding:'12px 20px',borderBottom:`1px solid ${R(C.outline,0.1)}`,display:'flex',justifyContent:'space-between',alignItems:'center',gap:14,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:22,flexWrap:'wrap'}}>
                <Toggle on={showRaw} label="Raw levels" onChange={setShowRaw}/>
                <Toggle on={showTrade} label="Trade zones" onChange={setShowTrade}/>
                <Toggle on={showVol} label="Volume" onChange={setShowVol}/>
                <Toggle on={showStrategy} label="BMSB strategy" onChange={setShowStrategy}/>
                <Toggle on={showStrategy2} label="BMSB strategy 2" onChange={setShowStrategy2}/>
                <Toggle on={showGaussian} label="Gaussian channel" onChange={v=>{setShowGaussian(v); if(v) setShowGaussianSignals(true);}}/>
                <Toggle on={showGaussianSignals} label="Gaussian signals" onChange={setShowGaussianSignals}/>
              </div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {['1M','3M','6M','YTD','1Y','ALL'].map(rg=>{
                  const a=rg===fcChartRange;
                  return <button key={rg} onClick={()=>setFcChartRange(rg)} style={{padding:'5px 11px',borderRadius:6,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,border:`1px solid ${a?R(C.cyan,0.4):'rgba(132,148,149,0.18)'}`,background:a?R(C.cyan,0.16):'rgba(20,20,21,0.6)',color:a?C.cyan:C.onVar}}>{rg}</button>;
                })}
              </div>
            </div>
            <div style={{padding:'18px 20px'}}>
              <CandleChart bars={visibleSelBars} levels={buildChartLevels(selPlan?.trade_levels, selPlan?.raw_levels, showTrade, showRaw)} lines={selLines}
                zones={[
                  ...(selRow?.entry!=null && selRow?.target!=null ? [{p1:selRow.entry,p2:selRow.target,color:C.lime,opacity:0.07}] : []),
                  ...(selRow?.entry!=null && selRow?.stop!=null ? [{p1:selRow.entry,p2:selRow.stop,color:C.err,opacity:0.08}] : []),
                ]}
                strategyOverlay={strategyOverlay}
                gaussianOverlay={gaussianOverlay}
                showVol={showVol} height={600} stale={selBarsInfo.stale} lastDate={selBarsInfo.lastDate}/>
            </div>
          </GlassCard>
        )}
      </>)}

      {/* ── Order Confirmation Modal ── */}
      {confirm && (
        <div onClick={()=>setConfirm(null)} style={{position:'fixed',inset:0,zIndex:70,background:'rgba(8,8,9,0.80)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:460,background:'rgba(20,19,20,0.98)',border:`1px solid ${R(C.outline,0.22)}`,borderRadius:14,boxShadow:'0 30px 80px rgba(0,0,0,0.7)',overflow:'hidden'}}>
            {/* header */}
            <div style={{padding:'18px 22px',borderBottom:`1px solid ${R(C.outline,0.14)}`,display:'flex',alignItems:'center',gap:12}}>
              <Icon n={confirm.type==='place'?'send':'close'} size={20} color={confirm.type==='place'?C.cyan:C.err}/>
              <span style={{fontFamily:"'Hanken Grotesk',sans-serif",fontSize:17,fontWeight:600,color:C.onSurf}}>
                {confirm.type==='place'?'Confirm Place Order':'Confirm Close Position'}
              </span>
            </div>
            {/* body */}
            <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:10,background:R(C.magenta,0.06),border:`1px solid ${R(C.magenta,0.22)}`}}>
                <Icon n="shield_lock" size={18} color={C.magenta} style={{flexShrink:0}}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.magenta,lineHeight:1.5}}>Paper account · respects DRY_RUN · no real money at risk</span>
              </div>
              {confirm.type==='place' ? (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 18px'}}>
                  {[
                    ['Symbol', confirm.row.symbol],
                    ['Side', confirm.row.signal],
                    ['Entry', '$'+Number(confirm.row.entry||0).toFixed(2)],
                    ['Stop', '$'+Number(confirm.row.stop||0).toFixed(2)],
                    ['Target', '$'+Number(confirm.row.target||0).toFixed(2)],
                    ['Qty', confirm.row.quantity||'—'],
                    ['R:R', Number(confirm.row.reward_risk||0).toFixed(2)],
                    ['Strategy', confirm.row.strategy||'—'],
                  ].map(([k,v])=>(
                    <div key={k}>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.outline,marginBottom:4}}>{k}</div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:C.onSurf,fontWeight:500}}>{v}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,color:C.onSurf,padding:'10px 0'}}>
                  Close all open positions for <span style={{color:C.err}}>{confirm.row.symbol}</span> via a paper market order.
                </div>
              )}
            </div>
            {/* footer */}
            <div style={{padding:'16px 22px',borderTop:`1px solid ${R(C.outline,0.14)}`,display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button onClick={()=>setConfirm(null)}
                style={{padding:'10px 20px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.onVar,background:'rgba(28,27,28,0.8)',border:`1px solid ${R(C.outline,0.25)}`}}>
                Cancel
              </button>
              <button onClick={()=>confirm.type==='place'?doPlace(confirm.row):doClose(confirm.row.symbol)}
                style={{padding:'10px 22px',borderRadius:8,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:600,
                  color:confirm.type==='place'?'#001416':C.onSurf,
                  background:confirm.type==='place'?C.cyan:C.err,
                  border:'none'}}>
                {confirm.type==='place'?'Place Order':'Close Position'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   TAB: REPORTS
═══════════════════════════════════════════════════════════════════════════ */
function TabCrypto({refreshKey=0}) {
  const [data, setData] = useState(null);
  const [selected, setSelected] = useState('');
  const [tf, setTf] = useState('1D');
  const [range, setRange] = useState('6M');
  const [showRaw, setShowRaw] = useState(false);
  const [showTrade, setShowTrade] = useState(true);
  const [showVol, setShowVol] = useState(true);
  const [showStrategy, setShowStrategy] = useState(false);
  const [showStrategy2, setShowStrategy2] = useState(false);
  const [showGaussian, setShowGaussian] = useState(false);
  const [showGaussianSignals, setShowGaussianSignals] = useState(false);
