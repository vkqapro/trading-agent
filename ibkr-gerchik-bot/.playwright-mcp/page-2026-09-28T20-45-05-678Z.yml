ior upper channel to above the current upper channel while the simulated position is flat/non-long\\\",\\\"semantic_meaning\\\":\\\"A long setup was detected by the deterministic monitor; it is analysis-only in Decision Lab.\\\",\\\"candidate_class\\\":\\\"WATCH_CANDIDATE\\\"},{\\\"signal_id\\\":\\\"GAUSSIAN_NEAR_LONG\\\",\\\"description\\\":\\\"Price is within the configured near threshold of the upper channel while the filtered mid is rising.\\\",\\\"conditions\\\":\\\"no recent cross signal and close is at/below the current upper channel with abs(upper-close)/close <= near_threshold_pct\\\",\\\"semantic_meaning\\\":\\\"A watch candidate near a potential long trigger, not a confirmed entry.\\\",\\\"candidate_class\\\":\\\"WATCH_CANDIDATE\\\"},{\\\"signal_id\\\":\\\"GAUSSIAN_LONG_EXIT\\\",\\\"description\\\":\\\"A recent close cross below the Gaussian upper channel while the monitor's simulated position is long.\\\",\\\"conditions\\\":\\\"simulated position is long and close crosses from at/above the prior upper channel to below the current upper channel\\\",\\\"semantic_meaning\\\":\\\"A position-management signal; it only applies when the same-symbol position exists.\\\",\\\"candidate_class\\\":\\\"POSITION_MANAGEMENT_SIGNAL\\\"},{\\\"signal_id\\\":\\\"GAUSSIAN_NEAR_EXIT\\\",\\\"description\\\":\\\"A long simulated position is near the upper-channel exit condition.\\\",\\\"conditions\\\":\\\"simulated position is long, close is at/above the current upper channel, and abs(close-upper)/close <= near_threshold_pct\\\",\\\"semantic_meaning\\\":\\\"A position-management watch signal; it is not applicable without a matching same-symbol position.\\\",\\\"candidate_class\\\":\\\"POSITION_MANAGEMENT_SIGNAL\\\"},{\\\"signal_id\\\":\\\"NO_SIGNAL\\\",\\\"description\\\":\\\"No current Gaussian signal.\\\",\\\"conditions\\\":\\\"no qualifying recent cross or near condition\\\",\\\"semantic_meaning\\\":\\\"No candidate is emitted to Decision Lab.\\\",\\\"candidate_class\\\":\\\"NONE\\\"}],\\\"candidate_class_mapping\\\":{\\\"GAUSSIAN_LONG_ENTRY\\\":\\\"WATCH_CANDIDATE\\\",\\\"GAUSSIAN_NEAR_LONG\\\":\\\"WATCH_CANDIDATE\\\",\\\"GAUSSIAN_LONG_EXIT\\\":\\\"POSITION_MANAGEMENT_SIGNAL\\\",\\\"GAUSSIAN_NEAR_EXIT\\\":\\\"POSITION_MANAGEMENT_SIGNAL\\\"},\\\"execution_capability\\\":\\\"ANALYSIS_ONLY\\\",\\\"limitations\\\":[\\\"The monitor's historical simulated position is not a broker position.\\\",\\\"Gaussian candidates do not contain a deterministic entry/stop/target plan.\\\",\\\"Decision Lab must not convert Gaussian signals into executable entries.\\\"],\\\"implementation_provenance\\\":[\\\"dashboard_react/server.py:_gaussian_alpha\\\",\\\"dashboard_react/server.py:_gaussian_filter\\\",\\\"dashboard_react/server.py:_gaussian_scan_symbol\\\"],\\\"definition_hash\\\":\\\"50e0978ac9efcca1565f3a67f76713ee082a32bcb0c5c2382538559026fbcb25\\\"},\\\"strategy_parameters\\\":{\\\"timeframe\\\":\\\"daily\\\",\\\"period\\\":144,\\\"poles\\\":4,\\\"channel_multiplier\\\":1.414,\\\"near_threshold_pct\\\":1.0,\\\"recent_signal_days\\\":2},\\\"analysis_instructions\\\":{\\\"prompt_id\\\":\\\"builtin-gaussian-balanced-v1\\\",\\\"prompt_name\\\":\\\"Gaussian Balanced\\\",\\\"prompt_version\\\":\\\"v1\\\",\\\"prompt_hash\\\":\\\"16ba42eb58a57543f146962520fda6efa3da90a08be8c4d312778e12d1f9ea29\\\",\\\"prompt_text\\\":\\\"Evaluate the source-defined Gaussian signal conservatively. Distinguish a near trigger from a confirmed cross. Prefer WAIT when evidence is incomplete.\\\"},\\\"candidate\\\":{\\\"candidate_id\\\":\\\"analysis-1846ca85348fc3271736064090c8f2d5\\\",\\\"created_at\\\":\\\"2026-09-28T00:00:00+00:00\\\",\\\"asset_class\\\":\\\"stock\\\",\\\"symbol\\\":\\\"APLM\\\",\\\"strategy\\\":\\\"GAUSSIAN\\\",\\\"direction\\\":\\\"long\\\",\\\"entry\\\":null,\\\"stop\\\":null,\\\"target\\\":null,\\\"level_price\\\":null,\\\"level_type\\\":\\\"\\\",\\\"level_strength\\\":null,\\\"atr\\\":null,\\\"reward_risk\\\":null,\\\"risk_per_share\\\":null,\\\"confidenc